name: "Hubitat MCP AI"
version: "0.10.202"
slug: hubitat_mcp_ai
description: "HomeBrainOS native Gemini function-calling bridge for Hubitat MCP"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: stable
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8788
panel_icon: mdi:home-assistant
panel_title: "Hubitat MCP AI"
ports:
  8788/tcp: 8788
ports_description:
  8788/tcp: "Hubitat MCP AI web interface"
webui: "http://[HOST]:[PORT:8788]"
options:
  hubitat_mcp_url: ""
  hubitat_mcp_token: ""
  gemini_enabled: true
  gemini_base_url: "https://generativelanguage.googleapis.com/v1beta"
  gemini_api_key: ""
  gemini_model: "gemini-3.6-flash"
  gemini_timeout_seconds: 15
  mcp_timeout_seconds: 25
  mcp_device_cache_seconds: 12
  conversation_context_ttl_seconds: 600
  confirmation_ttl_seconds: 120
  unified_mcp_agent_enabled: true
  unified_mcp_tool_limit: 48
  require_sensitive_confirmation: true
  rule_write_enabled: true
  rule_create_paused_required: true
  web_title: "Hubitat MCP AI"
schema:
  hubitat_mcp_url: str
  hubitat_mcp_token: password
  gemini_enabled: bool
  gemini_base_url: str
  gemini_api_key: password
  gemini_model: str
  gemini_timeout_seconds: int
  mcp_timeout_seconds: int
  mcp_device_cache_seconds: int
  conversation_context_ttl_seconds: int
  confirmation_ttl_seconds: int
  unified_mcp_agent_enabled: bool
  unified_mcp_tool_limit: int
  require_sensitive_confirmation: bool
  rule_write_enabled: bool
  rule_create_paused_required: bool
  web_title: str
