  control_level_verification_timeout_seconds: int(1,20)
  semantic_intent_timeout_seconds: int(2,30)
  semantic_intent_cache_seconds: int(30,3600)
  hybrid_assistant_mode_enabled: bool
  ai_evidence_planner_enabled: bool
