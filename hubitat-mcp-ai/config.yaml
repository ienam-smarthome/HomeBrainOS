  ai_evidence_planner_plan_timeout_seconds: int(4,30)
  ai_evidence_planner_synthesis_timeout_seconds: int(5,45)
  ai_evidence_planner_max_inventory_items: int(20,250)
  unified_mcp_agent_enabled: bool
  attention_stale_hours: int(1,720)
  hub_cpu_probe_enabled: bool
  hub_cpu_probe_timeout_seconds: int(1,20)
  control_verification_timeout_seconds: int(1,30)
  device_index_ttl_seconds: int(0,600)
  device_index_capability_ttl_seconds: int(0,3600)
