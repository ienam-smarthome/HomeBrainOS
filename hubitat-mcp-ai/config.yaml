name: "Hubitat MCP AI"
version: "0.10.346"
slug: hubitat_mcp_ai
description: "HomeBrainOS native Ollama Online function-calling bridge for Hubitat MCP"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: stable
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8788
panel_icon: mdi:home-assistant
panel_title: "Hubitat MCP AI"
ports:
  8788/tcp: null
ports_description:
  8788/tcp: "Optional direct web interface (disabled by default; use Home Assistant ingress)"
webui: "http://[HOST]:[PORT:8788]"
options:
  hubitat_mcp_url: ""
  hubitat_mcp_token: ""
  ollama_direct_cloud_enabled: true
  ollama_direct_cloud_base_url: "https://ollama.com"
  ollama_direct_cloud_api_key: ""
  ollama_direct_cloud_model: "gemma4:31b"
  ollama_cloud_model: "gemma4:31b-cloud"
  ollama_agent_timeout_seconds: 60
  stream_idle_timeout_seconds: 20
  mcp_timeout_seconds: 25
  mcp_device_cache_seconds: 12
  mcp_retry_attempts: 3
  mcp_retry_backoff_seconds: 0.25
  conversation_context_ttl_seconds: 600
  confirmation_ttl_seconds: 120
  unified_mcp_agent_enabled: true
  unified_mcp_tool_limit: 48
  max_tool_result_chars: 24000
  require_sensitive_confirmation: true
  rule_write_enabled: true
  rule_create_paused_required: true
  web_title: "Hubitat MCP AI"
schema:
  hubitat_mcp_url: str
  hubitat_mcp_token: password
  ollama_direct_cloud_enabled: bool
  ollama_direct_cloud_base_url: str
  ollama_direct_cloud_api_key: password
  ollama_direct_cloud_model: str
  ollama_cloud_model: str
  ollama_agent_timeout_seconds: int
  stream_idle_timeout_seconds: int
  mcp_timeout_seconds: int
  mcp_device_cache_seconds: int
  mcp_retry_attempts: int
  mcp_retry_backoff_seconds: float
  conversation_context_ttl_seconds: int
  confirmation_ttl_seconds: int
  unified_mcp_agent_enabled: bool
  unified_mcp_tool_limit: int
  max_tool_result_chars: int
  require_sensitive_confirmation: bool
  rule_write_enabled: bool
  rule_create_paused_required: bool
  web_title: str
