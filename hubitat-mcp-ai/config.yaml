name: "Hubitat MCP AI"
version: "0.16.33"
slug: hubitat_mcp_ai
description: "HomeBrainOS native Ollama Online function-calling bridge for Hubitat MCP"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: stable
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ingress: true
homeassistant_api: true
hassio_api: true
hassio_role: default
ingress_port: 8788
panel_icon: mdi:home-assistant
panel_title: "Hubitat MCP AI"
ports:
  8788/tcp: null
ports_description:
  8788/tcp: "Optional direct web interface (disabled by default; use Home Assistant ingress)"
webui: "http://[HOST]:[PORT:8788]"
options:
  hubitat_mcp_url: ""
  hubitat_mcp_token: ""
  ollama_direct_cloud_enabled: true
  ollama_direct_cloud_base_url: "https://ollama.com"
  ollama_direct_cloud_api_key: ""
  ollama_direct_cloud_model: "gemma4:31b-cloud"
  ollama_cloud_model: "gemma4:31b-cloud"
  ollama_local_enabled: false
  ollama_local_base_url: "http://localhost:11434"
  ollama_local_model: ""
  ollama_local_timeout_seconds: 12
  ollama_local_connect_timeout_seconds: 3
  ollama_local_keep_alive_seconds: 120
  ollama_agent_timeout_seconds: 60
  stream_idle_timeout_seconds: 20
  mcp_timeout_seconds: 25
  mcp_device_cache_seconds: 12
  mcp_identity_cache_seconds: 120
  mcp_max_concurrent_calls: 2
  mcp_retry_attempts: 3
  mcp_retry_backoff_seconds: 0.25
  conversation_context_ttl_seconds: 600
  confirmation_ttl_seconds: 120
  unified_mcp_agent_enabled: true
  unified_mcp_tool_limit: 48
  unified_mcp_max_tool_rounds: 9
  max_tool_result_chars: 24000
  require_sensitive_confirmation: true
  rule_write_enabled: true
  rule_create_paused_required: true
  deterministic_reads_enabled: false
  causal_subject_prefetch_enabled: true
  causal_deterministic_final_enabled: true
  semantic_agent_enabled: true
  semantic_default_brightness_step: 20
  semantic_default_temperature_step: 1.0
  morning_health_check_enabled: true
  morning_health_check_time: "07:00"
  health_check_log_hours: 24
  health_check_low_battery: 20
  health_check_stale_hours: 24
  health_check_long_stale_hours: 168
  health_check_cluster_minutes: 15
  health_check_motion_active_hours: 2
  pushover_enabled: false
  pushover_app_token: ""
  pushover_user_key: ""
  pushover_device: ""
  ha_tts_enabled: true
  ha_tts_notify_service: ""
  ha_tts_media_stream: ""
  chatgpt_mcp_enabled: false
  chatgpt_mcp_require_bearer_auth: true
  chatgpt_mcp_token: ""
  web_title: "Hubitat MCP AI"
schema:
  hubitat_mcp_url: str
  hubitat_mcp_token: password
  ollama_direct_cloud_enabled: bool
  ollama_direct_cloud_base_url: str
  ollama_direct_cloud_api_key: password
  ollama_direct_cloud_model: str
  ollama_cloud_model: str
  ollama_local_enabled: bool
  ollama_local_base_url: str
  ollama_local_model: str
  ollama_local_timeout_seconds: int
  ollama_local_connect_timeout_seconds: int
  ollama_local_keep_alive_seconds: int
  ollama_agent_timeout_seconds: int
  stream_idle_timeout_seconds: int
  mcp_timeout_seconds: int
  mcp_device_cache_seconds: int
  mcp_identity_cache_seconds: int
  mcp_max_concurrent_calls: int
  mcp_retry_attempts: int
  mcp_retry_backoff_seconds: float
  conversation_context_ttl_seconds: int
  confirmation_ttl_seconds: int
  unified_mcp_agent_enabled: bool
  unified_mcp_tool_limit: int
  unified_mcp_max_tool_rounds: int
  max_tool_result_chars: int
  require_sensitive_confirmation: bool
  rule_write_enabled: bool
  rule_create_paused_required: bool
  deterministic_reads_enabled: bool
  causal_subject_prefetch_enabled: bool
  causal_deterministic_final_enabled: bool
  semantic_agent_enabled: bool
  semantic_default_brightness_step: int
  semantic_default_temperature_step: float
  morning_health_check_enabled: bool
  morning_health_check_time: str
  health_check_log_hours: int
  health_check_low_battery: int
  health_check_stale_hours: int
  health_check_long_stale_hours: int
  health_check_cluster_minutes: int
  health_check_motion_active_hours: int
  pushover_enabled: bool
  pushover_app_token: password
  pushover_user_key: password
  pushover_device: str
  ha_tts_enabled: bool
  ha_tts_notify_service: str
  ha_tts_media_stream: str
  chatgpt_mcp_enabled: bool
  chatgpt_mcp_require_bearer_auth: bool
  chatgpt_mcp_token: password
  web_title: str
