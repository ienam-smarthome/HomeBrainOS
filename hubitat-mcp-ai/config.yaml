name: "Hubitat MCP AI"
version: "0.16.86"
slug: hubitat_mcp_ai
description: "HomeBrainOS native Ollama Online function-calling bridge for Hubitat MCP"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: HomeBrain
homeassistant_api: true
host_network: true
map:
  - config:rw
options:
  hubitat_mcp_url: ""
  ollama_url: "https://ollama.com"
  ollama_api_key: ""
  ollama_model: "gemma4:31b-cloud"
  ollama_fallback_model: "qwen3.5:4b"
  ollama_timeout: 120
  ollama_num_ctx: 32768
  ollama_num_predict: 4096
  ollama_keep_alive: "30m"
  cache_ttl: 300
  request_timeout: 120
  verify_ssl: true
  pushover_user_key: ""
  pushover_api_token: ""
  system_check_hour: 8
  system_check_minute: 0
  system_check_enabled: false
  tts_enabled: false
  tts_entity: ""
  tts_language: "en"
schema:
  hubitat_mcp_url: str
  ollama_url: str
  ollama_api_key: password
  ollama_model: str
  ollama_fallback_model: str
  ollama_timeout: int(10,600)
  ollama_num_ctx: int(2048,131072)
  ollama_num_predict: int(256,16384)
  ollama_keep_alive: str
  cache_ttl: int(30,3600)
  request_timeout: int(10,600)
  verify_ssl: bool
  pushover_user_key: password
  pushover_api_token: password
  system_check_hour: int(0,23)
  system_check_minute: int(0,59)
  system_check_enabled: bool
  tts_enabled: bool
  tts_entity: str?
  tts_language: str
