name: "Hubitat MCP AI"
version: "0.10.134"
slug: hubitat_mcp_ai
description: "HomeBrain AI-first Hubitat assistant with unified MCP tool calling, guarded writes and verified fallback"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: stable
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8788
panel_icon: mdi:home-assistant
panel_title: Hubitat MCP AI
homeassistant_api: true
hassio_api: true
host_network: true
map:
  - addon_config:rw
options:
  mcp_url: ""
  mcp_token: ""
  request_timeout_seconds: 25
  mcp_max_concurrent_calls: 4
  mcp_device_cache_seconds: 20
  mcp_catalog_cache_seconds: 300
  mcp_hub_cache_seconds: 60
  mcp_allow_stale_reads: true
  mcp_stale_read_seconds: 120
  mcp_write_timeout_seconds: 45
  ollama_base_url: "http://host.docker.internal:11434"
  ollama_model: "qwen3.5:4b"
  ollama_planner_model: "qwen3.5:4b"
  ollama_routine_model: "qwen3.5:4b"
  ollama_cloud_enabled: true
  ollama_cloud_model: "gemma4:31b-cloud"
  ollama_local_fallback_model: "qwen3.5:4b"
  ollama_cloud_fallback_local: true
  ollama_cloud_timeout_seconds: 12
  ollama_direct_cloud_enabled: true
  ollama_direct_cloud_base_url: "https://ollama.com"
  ollama_direct_cloud_api_key: ""
  ollama_direct_cloud_model: ""
  ollama_direct_cloud_fallback_local_proxy: true
  ollama_health_timeout_seconds: 3
  ollama_planner_timeout_seconds: 25
  ollama_response_timeout_seconds: 35
  ollama_routine_response_timeout_seconds: 25
  ollama_num_ctx: 8192
  ollama_num_predict: 240
  ollama_keep_alive: "30m"
  ollama_planner_tool_limit: 40
  unified_mcp_tool_limit: 48
  ollama_tool_result_limit_chars: 8000
  ollama_max_tool_rounds: 6
  require_sensitive_confirmation: true
  ollama_evidence_item_limit: 8
  home_snapshot_ai_enabled: true
  home_snapshot_ai_timeout_seconds: 20
  home_snapshot_max_items_per_group: 8
  ollama_quick_insight_timeout_seconds: 20
  conversation_context_ttl_seconds: 600
  conversation_context_max_sessions: 128
  control_confirmation_ttl_seconds: 120
  rule_workflow_ttl_seconds: 600
  rule_write_enabled: false
  rule_create_paused_required: true
  control_agent_intent_timeout_seconds: 5
  control_agent_auto_execute_confidence_percent: 88
  control_agent_block_below_confidence_percent: 50
  control_agent_group_confirmation_size: 6
  control_level_verification_timeout_seconds: 3
  semantic_intent_timeout_seconds: 5
  semantic_intent_cache_seconds: 300
  hybrid_assistant_mode_enabled: true
  ai_evidence_planner_enabled: true
  ai_evidence_planner_prefer_cloud: true
  ai_evidence_planner_max_rounds: 2
  ai_evidence_planner_plan_timeout_seconds: 12
  ai_evidence_planner_synthesis_timeout_seconds: 20
  ai_evidence_planner_max_inventory_items: 120
  unified_mcp_agent_enabled: true
  attention_stale_hours: 48
  hub_cpu_probe_enabled: true
  hub_cpu_probe_timeout_seconds: 2.5
  control_verification_timeout_seconds: 7
  device_index_ttl_seconds: 30
  device_index_capability_ttl_seconds: 300
  device_index_metadata_ttl_seconds: 600
  dashboard_refresh_seconds: 60
  hub_restart_confirmation_ttl_seconds: 120
  hub_firmware_update_confirmation_ttl_seconds: 120
  request_trace_limit: 20
schema:
  mcp_url: str
  mcp_token: password
  request_timeout_seconds: int(5,120)
  mcp_max_concurrent_calls: int(1,16)
  mcp_device_cache_seconds: int(0,300)
  mcp_catalog_cache_seconds: int(0,3600)
  mcp_hub_cache_seconds: int(0,600)
  mcp_allow_stale_reads: bool
  mcp_stale_read_seconds: int(0,900)
  mcp_write_timeout_seconds: int(5,180)
  ollama_base_url: str
  ollama_model: str
  ollama_planner_model: str
  ollama_routine_model: str
  ollama_cloud_enabled: bool
  ollama_cloud_model: str
  ollama_local_fallback_model: str
  ollama_cloud_fallback_local: bool
  ollama_cloud_timeout_seconds: int(8,90)
  ollama_direct_cloud_enabled: bool
  ollama_direct_cloud_base_url: str
  ollama_direct_cloud_api_key: password
  ollama_direct_cloud_model: str
  ollama_direct_cloud_fallback_local_proxy: bool
  ollama_health_timeout_seconds: int(1,30)
