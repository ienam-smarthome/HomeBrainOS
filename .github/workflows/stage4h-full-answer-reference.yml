name: Stage 4H actual full-answer reference reviews (synthetic only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4h-full-answer-reference.yml'
      - 'hubitat-mcp-ai/tools/stage4h_github_full_answer_reference.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_full_answer_reference.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4h-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-answer-reviews:
    name: Independent reference vs two actual local 3B reviewers
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_CONTEXT_LENGTH: '3072'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic corpus and no-cloud network scope
        run: |
          set -euo pipefail
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          test "$OLLAMA_NO_CLOUD" = "1"
          python -m compileall -q hubitat-mcp-ai/tools/stage4h_github_full_answer_reference.py
          python -m compileall -q hubitat-mcp-ai/rootfs/app/stage4_full_answer_reference.py
      - name: Install public Ollama on ephemeral runner
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/stage4h-installer.sh
          sh /tmp/stage4h-installer.sh
          ollama --version
      - name: Start isolated no-cloud model server
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4h-ollama-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Local inference ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local inference not ready"
          exit 1
      - name: Download Qwen2.5 3B and Llama 3.2 3B as local models
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama pull llama3.2:3b
          ollama list | grep -F 'qwen2.5:3b'
          ollama list | grep -F 'llama3.2:3b'
      - name: Measure real model classification of labelled complete answers
        timeout-minutes: 48
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4h_github_full_answer_reference.py \
            --ack-github-synthetic-local-inference --timeout-seconds 120
      - name: Assert household and production isolation
        if: always()
        run: |
          echo "Only synthetic pre-authored source records and aggregate metrics."
          echo "No Hubitat, Home Assistant, credentials, production publisher or device changes."
