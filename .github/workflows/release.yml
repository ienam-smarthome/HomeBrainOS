name: Package Hubitat MCP AI add-on

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create add-on archive
        run: |
          mkdir -p dist
          tar -czf dist/hubitat-mcp-ai-addon.tar.gz hubitat-mcp-ai
      - uses: actions/upload-artifact@v4
        with:
          name: hubitat-mcp-ai-addon
          path: dist/hubitat-mcp-ai-addon.tar.gz
