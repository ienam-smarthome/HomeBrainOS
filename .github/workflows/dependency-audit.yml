name: Dependency audit

on:
  pull_request:
    paths:
      - "hubitat-mcp-ai/rootfs/app/requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "hubitat-mcp-ai/rootfs/app/requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Audit shipped Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hubitat-mcp-ai/rootfs/app/requirements.txt
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit add-on requirements
        id: audit
        continue-on-error: true
        run: |
          python -m pip_audit \
            --requirement hubitat-mcp-ai/rootfs/app/requirements.txt \
            --format json \
            --output pip-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ github.sha }}
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: |
          echo "Known vulnerabilities were found, or the audit could not complete."
          exit 1
