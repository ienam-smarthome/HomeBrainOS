name: One-shot 0.16.95 Internet alias patch
on:
  push:
    paths:
      - .github/workflows/one-shot-internet-aliases-0.16.95.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internet-control-aliases-0.16.95
      - name: Apply patch
        run: python .github/scripts/patch_internet_aliases_01695.py
      - name: Commit patch
        run: |
          rm .github/workflows/one-shot-internet-aliases-0.16.95.yml
          rm .github/scripts/patch_internet_aliases_01695.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "HomeBrain 0.16.95 explicit Internet control aliases"
          git push origin HEAD:fix/internet-control-aliases-0.16.95
