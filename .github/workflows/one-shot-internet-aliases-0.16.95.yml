name: One-shot 0.16.95 Internet alias patch
on:
  push:
    paths:
      - .github/workflows/one-shot-internet-aliases-0.16.95.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internet-control-aliases-0.16.95
      - name: Remove optional README insertion from patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch_internet_aliases_01695.py')
          s = p.read_text()
          old = '''replace_once(
              path,
              "semantic_default_temperature_step: 1.0\\n",
              "semantic_default_temperature_step: 1.0\\ninternet_control_aliases_json: '{\\\"Google TV\\\":\\\"Block Media-Google-TV-Streamer\\\"}'\\n",
          )
          '''
          if old not in s:
              raise SystemExit('README optional insertion block not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Apply patch
        run: python .github/scripts/patch_internet_aliases_01695.py
      - name: Commit patch
        run: |
          rm .github/workflows/one-shot-internet-aliases-0.16.95.yml
          rm .github/scripts/patch_internet_aliases_01695.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "HomeBrain 0.16.95 explicit Internet control aliases"
          git push origin HEAD:fix/internet-control-aliases-0.16.95
