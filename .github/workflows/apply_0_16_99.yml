name: Apply 0.16.99 patch
on:
  push:
    branches:
      - fix/immediate-internet-unblock-0.16.99
    paths:
      - .github/workflows/apply_0_16_99.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/immediate-internet-unblock-0.16.99
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_0_16_99.py
      - name: Route bare unblock through authoritative Internet scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hubitat-mcp-ai/rootfs/app/request_classification.py')
          text = p.read_text(encoding='utf-8')
          marker = '''_ALLOW_INTERNET = re.compile(
              r"^(?:please\\s+)?(?:allow|enable)\\s+"
              r"(?:internet\\s+(?:access\\s+)?(?:for\\s+)?|access\\s+for\\s+)?"
              r"(?P<target>.+?)\\s*[.!?]*$",
              re.I,
          )
          '''
          addition = marker + '''_UNBLOCK_INTERNET = re.compile(
              r"^(?:please\\s+)?unblock\\s+(?P<target>.+?)\\s*[.!?]*$",
              re.I,
          )
          '''
          if '_UNBLOCK_INTERNET = re.compile(' not in text:
              if marker not in text:
                  raise SystemExit('allow marker missing')
              text = text.replace(marker, addition, 1)
          old_comment = '''# "unblock"/"restore" are only safe to treat as internet-access verbs when
          # "internet"/"access" is stated explicitly -- unlike block/disable/allow/
          # enable (specific enough on their own), both words are heavily overloaded
          # elsewhere in this codebase ("restore the backup", "restore default
          # settings") and a bare "restore the backup" must never be reinterpreted as
          # "unblock a device named backup". These are deliberately a separate,
          # stricter pair rather than folded into _ALLOW_INTERNET's optional clause.
          '''
          new_comment = '''# Bare `unblock <target>` is safe to admit here because execution is now scoped
          # to the authoritative Internet room and fails closed outside it. `restore`
          # remains explicit-only because it is heavily overloaded (restore backup,
          # restore defaults) and must never be interpreted as Internet control unless
          # the user says internet/access.
          '''
          text = text.replace(old_comment, new_comment, 1)
          loop_old = '''        (_ALLOW_INTERNET, "allowInternet"),
                  (_ALLOW_INTERNET_EXPLICIT, "allowInternet"),
          '''
          loop_new = '''        (_ALLOW_INTERNET, "allowInternet"),
                  (_UNBLOCK_INTERNET, "allowInternet"),
                  (_ALLOW_INTERNET_EXPLICIT, "allowInternet"),
          '''
          if '(_UNBLOCK_INTERNET, "allowInternet")' not in text:
              if loop_old not in text:
                  raise SystemExit('intent loop marker missing')
              text = text.replace(loop_old, loop_new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile touched runtime
        run: python -m py_compile hubitat-mcp-ai/rootfs/app/homebrain_agent.py hubitat-mcp-ai/rootfs/app/request_classification.py
      - name: Run focused regressions
        run: |
          python -m pip install -q pytest pytest-asyncio httpx pydantic
          pytest -q tests/test_homebrain_agent.py -k 'immediate_block_request or immediate_allow_request or live_unblock_m6_ultra_pc or unconverged_block or scheduled_block_request or no_capable_device'
      - name: Commit release patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'HomeBrain 0.16.99: fix immediate Internet unblock semantics'
          git push
