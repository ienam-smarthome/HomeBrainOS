name: Apply tool-gate CI fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tool-call-driven-mutation-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CI alignment fixes
        run: python scripts/fix_tool_gate_ci.py
      - name: Run focused tests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests/test_mcp_agent_orchestrator.py tests/test_orchestrator_extracted_modules.py tests/test_tool_call_driven_gate.py
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align tests with tool-call-driven mutation gating"
          git push origin HEAD:refactor/tool-call-driven-mutation-gate
