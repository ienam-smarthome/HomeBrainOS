name: One-shot 0.16.94 release packaging
on:
  push:
    branches: [fix/internet-switch-scheduling-0.16.94]
permissions:
  contents: write
jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internet-switch-scheduling-0.16.94
          fetch-depth: 0
      - name: Align 0.16.94 release metadata
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('hubitat-mcp-ai/config.yaml', 'version: "0.16.93"', 'version: "0.16.94"')
          replace_once('README.md', '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.93 |', '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.94 |')
          replace_once('hubitat-mcp-ai/README.md', 'Current add-on version: **0.16.93**.', 'Current add-on version: **0.16.94**.')
          replace_once(
              'hubitat-mcp-ai/README.md',
              '## Architecture\n\n',
              '## Architecture\n\n0.16.94 aligns scheduled Internet access with the authoritative 0.16.89 switch semantics. Devices in the Hubitat `Internet` room are ordinary Switch controls: `off` means Internet blocked and `on` means Internet allowed. RuleAuthoringService now scopes semantic `block`/`allow` target matching to that room first, then verifies and schedules the real `off`/`on` command on the selected control surface. A similarly named normal device such as `Google TV Streamer (ADB)` therefore cannot steal the request, and HomeBrain no longer requires synthetic `blockInternet`/`allowInternet` commands that these controls do not advertise. Ordinary TV power schedules remain unchanged.\n\n',
          )
          replace_once(
              'hubitat-mcp-ai/CHANGELOG-INDEX.md',
              '## Current release\n\n- [0.16.93](CHANGELOG-0.16.93.md)\n\n## Recent performance releases\n\n',
              '## Current release\n\n- [0.16.94](CHANGELOG-0.16.94.md)\n\n## Recent performance releases\n\n- [0.16.93](CHANGELOG-0.16.93.md)\n',
          )

          Path('hubitat-mcp-ai/CHANGELOG-0.16.94.md').write_text('''# Hubitat MCP AI 0.16.94\n\n## Scheduled Internet access uses real switch semantics\n\n- Aligns RuleAuthoringService with the established Internet-room semantic contract: Hubitat `switch=off` means Internet blocked and `switch=on` means Internet allowed.\n- Scheduled `block`/`allow` requests no longer require synthetic `blockInternet`/`allowInternet` device commands.\n- Semantic Internet targets are first resolved only among devices assigned to the authoritative Hubitat `Internet` room/group, preventing a similarly named normal device such as `Google TV Streamer (ADB)` from winning the request.\n- After the Internet control surface is selected, HomeBrain re-reads it by authoritative label and verifies the real `off` or `on` command before proposing a Rule Machine write.\n- `block Google TV after 1 minute` therefore targets `Block Media-Google-TV-Streamer` and schedules `off`; `allow internet for Google TV after 1 minute` schedules `on`.\n- Ordinary power scheduling such as `turn off Google TV after 1 minute` is unchanged and remains eligible to target the normal TV/ADB device.\n- Relative-delay, absolute-time, recurring Rule Machine grammar, one-time self-pause safety, and confirmation behavior are otherwise unchanged.\n\n## Regression coverage\n\n- Models the real collision between `Google TV Streamer (ADB)` and `Block Media-Google-TV-Streamer` (device 6923).\n- The Internet control fixture exposes only ordinary `on`/`off` commands.\n- Block scheduling resolves device 6923 and emits Rule Machine `command=off`.\n- Allow scheduling resolves device 6923 and emits Rule Machine `command=on`.\n- The deterministic Internet-room scoping step is evidence-recorded.\n''')
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-package-0.16.94.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hubitat-mcp-ai/config.yaml hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md hubitat-mcp-ai/CHANGELOG-0.16.94.md .github/workflows/one-shot-package-0.16.94.yml
          git commit -m "Package HomeBrain 0.16.94"
          git push origin HEAD:fix/internet-switch-scheduling-0.16.94
