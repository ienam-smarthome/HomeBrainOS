name: Build 0.16.100 cleanup observability

on:
  push:
    branches:
      - fix/cleanup-scheduler-observability-0.16.100
    paths:
      - "tools/patch_0_16_100_cleanup_observability.py"
      - ".github/workflows/build_0_16_100_cleanup_observability.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cleanup-scheduler-observability-0.16.100
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Apply release patch
        run: python tools/patch_0_16_100_cleanup_observability.py

      - name: Compile runtime
        run: python -m compileall -q hubitat-mcp-ai/rootfs/app

      - name: Run focused cleanup regressions
        run: |
          pytest -q hubitat-mcp-ai/tests/test_one_time_rule_cleanup.py hubitat-mcp-ai/tests/test_cleanup_webui_contract.py

      - name: Run blocking release gate
        run: python scripts/run_release_gate.py

      - name: Commit final release branch
        run: |
          rm -f tools/patch_0_16_100_cleanup_observability.py
          rm -f .github/workflows/build_0_16_100_cleanup_observability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "HomeBrain 0.16.100: expose one-time cleanup scheduler"
          git push origin HEAD:fix/cleanup-scheduler-observability-0.16.100
