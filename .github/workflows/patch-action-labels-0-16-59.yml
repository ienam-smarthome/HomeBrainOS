name: Patch action labels 0.16.59

on:
  push:
    branches:
      - agent/log-grounding-and-synthesis-0-16-59

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/log-grounding-and-synthesis-0-16-59
      - name: Patch action labels and single-pass localization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py')
          text = path.read_text()
          old_prefix = r'''_BULLET_PREFIX = re.compile(r"^(\s*[*+-]\s+(?:\*\*[^*]+\*\*:\s*)?)(.*)$")'''
          new_prefix = r'''_BULLET_PREFIX = re.compile(r"^(\s*[*+-]\s+(?:\*\*[^*]+\*\*(?::\s*|\s+))?)(.*)$")'''
          assert old_prefix in text
          text = text.replace(old_prefix, new_prefix, 1)
          old = '''    bullet = _BULLET_PREFIX.match(line)\n    if bullet:\n        prefix, body = bullet.groups()\n        localized_body = _localize_analysis_text(body)\n        if _unsafe_recommendation(localized_body):\n            localized_body = _configuration_guidance(localized_body)\n        if localized_body != body:\n            return prefix + localized_body\n        return line\n'''
          new = '''    bullet = _BULLET_PREFIX.match(line)\n    if bullet:\n        prefix, body = bullet.groups()\n        localized_body = _localize_analysis_text(body)\n        if localized_body != body:\n            return prefix + localized_body\n        if _unsafe_recommendation(body):\n            return prefix + _configuration_guidance(body)\n        return line\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-action-labels-0-16-59.yml
          git add hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py
          git commit -m 'Preserve action labels and single-pass grounding'
          git push origin HEAD:agent/log-grounding-and-synthesis-0-16-59
