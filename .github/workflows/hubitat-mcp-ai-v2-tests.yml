name: Hubitat MCP AI v2 pilot tests
on:
  pull_request:
    paths:
      - "hubitat-mcp-ai-v2/**"
      - ".github/workflows/hubitat-mcp-ai-v2-tests.yml"
  push:
    paths:
      - "hubitat-mcp-ai-v2/**"
      - ".github/workflows/hubitat-mcp-ai-v2-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install v2 dependencies
        run: python -m pip install -r hubitat-mcp-ai-v2/rootfs/app/requirements.txt
      - name: Compile standalone runtime
        run: python -m compileall -q hubitat-mcp-ai-v2/rootfs/app hubitat-mcp-ai-v2/tests
      - name: Check interface JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('hubitat-mcp-ai-v2/rootfs/app/ui.html').read_text(); Path('/tmp/v2-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/v2-ui.js
      - name: Test answer copying and response timing
        run: node hubitat-mcp-ai-v2/tests/test_ui.mjs
      # Keep native/approval regressions independent of external browser
      # package installation; any missing browser still FAILS the CI job.
      - name: Run native MCP, confirmation and recorder tests
        run: python -m unittest discover -v -s hubitat-mcp-ai-v2/tests
      - name: Install browser acceptance dependencies
        timeout-minutes: 6
        run: |
          python -m pip install playwright==1.56.0
          # Ubuntu 24.04 hosted runners already include Chromium's runtime
          # libraries. Do not run an unbounded apt --with-deps transaction.
          python -m playwright install chromium
      - name: Check desktop and mobile interface in Chromium
        timeout-minutes: 5
        run: python hubitat-mcp-ai-v2/tests/browser_smoke.py

  container-smoke-v2:
    name: Build and probe v2 add-on container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated v2 image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/hassio-addons/base:15.0.8 \
            --build-arg BUILD_VERSION=2.0.0-alpha.7 \
            --build-arg BUILD_ARCH=amd64 \
            --tag hubitat-mcp-ai-v2:smoke \
            hubitat-mcp-ai-v2
      - name: Verify v2 runtime imports
        run: docker run --rm --entrypoint python3 hubitat-mcp-ai-v2:smoke -c "import app; assert app.app.title == 'Hubitat MCP AI v2'"
      - name: Start and test independent HTTP endpoints
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v2data"
          container="$(docker run -d -p 127.0.0.1:8789:8789 -v "$RUNNER_TEMP/v2data:/data" hubitat-mcp-ai-v2:smoke)"
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8789/api/status > "$RUNNER_TEMP/v2-status.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/v2-status.json')); assert d['mode']=='native-model-led-mcp'; assert not d['configured']"
          curl -fsS http://127.0.0.1:8789/api/diagnostics/status > "$RUNNER_TEMP/v2-diagnostics.json"
          curl -fsS http://127.0.0.1:8789/ > "$RUNNER_TEMP/v2-home.html"
          grep -q "Hubitat MCP AI v2" "$RUNNER_TEMP/v2-home.html"
