name: Hubitat MCP AI v2 pilot tests
on:
  pull_request:
    paths:
      - "hubitat-mcp-ai-v2/**"
      - ".github/workflows/hubitat-mcp-ai-v2-tests.yml"
  push:
    paths:
      - "hubitat-mcp-ai-v2/**"
      - ".github/workflows/hubitat-mcp-ai-v2-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install v2 dependencies
        run: python -m pip install -r hubitat-mcp-ai-v2/rootfs/app/requirements.txt
      - name: Compile standalone runtime
        run: python -m compileall -q hubitat-mcp-ai-v2/rootfs/app hubitat-mcp-ai-v2/tests
      - name: Run read-only agent and recorder tests
        run: python -m unittest discover -v -s hubitat-mcp-ai-v2/tests
