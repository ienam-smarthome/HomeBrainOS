name: One-shot 0.16.93 capability-first contract

on:
  push:
    branches:
      - fix/capability-resolver-fallback-0.16.93

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-resolver-fallback-0.16.93
          fetch-depth: 0
      - name: Apply contract alignment
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/contract_patch.py
          python /tmp/contract_patch.py
          git rm .github/workflows/one-shot-0.16.93-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubitat-mcp-ai tests
          git commit -m "Align 0.16.93 capability-first failure contract"
          git push origin HEAD:fix/capability-resolver-fallback-0.16.93
