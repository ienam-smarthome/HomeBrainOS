name: Patch 0.16.59 functional changes

on:
  push:
    branches:
      - agent/log-grounding-and-synthesis-0-16-59

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/log-grounding-and-synthesis-0-16-59
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 0.16.59 functional patch
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # 1) A successful hub_get_logs call through either supported gateway
          # must satisfy the request-local log grounding latch.
          path = root / 'hubitat-mcp-ai/rootfs/app/grounding_policy.py'
          text = path.read_text()
          old = '''        return (\n            name == "hub_read_diagnostics"\n            and gateway_operation(arguments) == "hub_get_logs"\n        )'''
          new = '''        if name == "hub_get_logs":\n            return True\n        return (\n            name in {"hub_read_diagnostics", "hub_manage_logs"}\n            and gateway_operation(arguments) == "hub_get_logs"\n        )'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          # 2) Serializer-side contradiction guard for successful metrics /
          # performance / logs evidence.
          path = root / 'hubitat-mcp-ai/rootfs/app/evidence_source_guard.py'
          text = path.read_text()
          anchor = '''_SOURCE_LABELS = {\n    "related_device_history": "related-device/sensor history",\n    "location_history": "location/mode history",\n    "logs": "native/log evidence",\n    "rules_apps": "rule/app evidence",\n    "device_history": "device history",\n}\n'''
          addition = anchor + '''\n_PERFORMANCE_SOURCE_ABSENCE = re.compile(\n    r"(?i)(?:\\bno\\b|\\bnot\\b|\\bdoes\\s+not\\b|\\bdid\\s+not\\b|\\bwithout\\b|"\n    r"\\bmissing\\b|\\bunavailable\\b)[^.!?]{0,180}"\n    r"(?:metrics?|performance\\s+(?:statistics?|stats?)|logs?|log\\s+entries|necessary\\s+data)"\n    r"|(?:metrics?|performance\\s+(?:statistics?|stats?)|logs?|log\\s+entries)[^.!?]{0,120}"\n    r"(?:not\\s+returned|were\\s+not\\s+returned|was\\s+not\\s+returned)",\n)\n\n\ndef _successful_performance_sources(evidence: list[dict[str, Any]]) -> list[str]:\n    found: list[str] = []\n    for receipt in evidence:\n        if not isinstance(receipt, dict) or receipt.get("success") is not True:\n            continue\n        tool = str(receipt.get("tool") or "")\n        sub_tool = str(receipt.get("sub_tool") or "")\n        leaf = sub_tool or tool\n        if leaf == "hub_get_metrics" and "hub metrics" not in found:\n            found.append("hub metrics")\n        elif leaf == "hub_get_performance_stats" and "performance statistics" not in found:\n            found.append("performance statistics")\n        elif leaf == "hub_get_logs" and "logs" not in found:\n            found.append("logs")\n    return found\n\n\ndef _guard_performance_source_absence(\n    message: str,\n    evidence: list[dict[str, Any]],\n) -> tuple[str, bool]:\n    sources = _successful_performance_sources(evidence)\n    text = str(message or "")\n    if not sources or not _PERFORMANCE_SOURCE_ABSENCE.search(text):\n        return text, False\n\n    pieces = _sentence_pieces(text)\n    changed = False\n    for index in range(0, len(pieces), 2):\n        sentence = pieces[index]\n        if not _PERFORMANCE_SOURCE_ABSENCE.search(sentence):\n            continue\n        comparable = sentence.casefold()\n        relevant = False\n        if "hub metrics" in sources and ("metric" in comparable or "necessary data" in comparable):\n            relevant = True\n        if "performance statistics" in sources and ("performance" in comparable or "necessary data" in comparable):\n            relevant = True\n        if "logs" in sources and ("log" in comparable or "necessary data" in comparable):\n            relevant = True\n        if not relevant:\n            continue\n        if len(sources) == 1:\n            rendered = sources[0]\n        else:\n            rendered = ", ".join(sources[:-1]) + f" and {sources[-1]}"\n        pieces[index] = (\n            f"Current-turn evidence did include successful {rendered}; "\n            "those results should be used for the requested performance analysis."\n        )\n        changed = True\n    return "".join(pieces), changed\n'''
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          old = '''    text = str(message or "")\n    categories = checked_source_categories(evidence)\n    if not categories or not _SOURCE_WAS_MISSING.search(text):\n        return text, False\n\n    pieces = _sentence_pieces(text)\n    changed = False\n'''
          new = '''    text = str(message or "")\n    text, performance_changed = _guard_performance_source_absence(text, evidence)\n    categories = checked_source_categories(evidence)\n    if not categories or not _SOURCE_WAS_MISSING.search(text):\n        return text, performance_changed\n\n    pieces = _sentence_pieces(text)\n    changed = False\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('''    return "".join(pieces), changed\n\n\ndef guard_positive_source_attribution''', '''    return "".join(pieces), changed or performance_changed\n\n\ndef guard_positive_source_attribution''', 1)
          path.write_text(text)

          # 3) Broaden semantic performance grounding to the exact 0.16.58 wording.
          path = root / 'hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py'
          text = path.read_text()
          text = text.replace(
              'r"recommendations?|grounded\\s+next\\s+actions?|next\\s+actions?|what\\s+to\\s+do\\s+next)\\b"',
              'r"recommendations?|recommended\\s+improvements?|grounded\\s+next\\s+actions?|next\\s+actions?|what\\s+to\\s+do\\s+next)\\b"',
              1,
          )
          text = text.replace(
              'r"synchronous(?:ly)?|timeouts?|retries?|reconnect(?:ion|ions|s|ing)?)\\b"',
              'r"synchronous(?:ly)?|timeouts?|retries?|reconnect(?:ion|ions|s|ing)?|non[- ]blocking)\\b"',
              1,
          )
          text = text.replace(
              'r"block(?:ing)? hub execution threads?|execution threads?|frequent reporting)\\b"',
              'r"block(?:ing)? hub execution threads?|execution threads?|blocking calls?|"\n    r"pause(?:s|d|ing)? other hub activities?|synchronous http requests?|frequent reporting)\\b"',
              1,
          )
          text = text.replace(
              'r"\\b(?:likely|probably)\\s+due\\s+to\\b|"',
              'r"\\b(?:likely|probably)\\s+(?:due\\s+to|caused\\s+by)\\b|"\n    r"\\b(?:is|are|was|were)\\s+(?:typically\\s+)?blocking\\s+calls?\\b|"\n    r"\\bcan\\s+pause\\s+other\\s+hub\\s+activities\\b|"',
              1,
          )
          text = text.replace(
              'r"\\b(?:cause|causes|caused|causing|lead\\s+to|leads\\s+to|result\\s+in|results\\s+in)\\b"',
              'r"\\b(?:cause|causes|caused|causing|lead\\s+to|leads\\s+to|leading\\s+to|result\\s+in|results\\s+in)\\b"',
              1,
          )
          marker = '''_NUMERIC_TUNING = re.compile(\n    r"(?i)\\b(?:threshold|interval|frequency|timeout|blind time|occupancy timeout|"\n    r"debounce|duration|cadence)\\b[^.!?\\n]{0,160}"\n    r"\\b\\d+(?:\\.\\d+)?\\s*(?:w|%|ms|s|sec(?:ond)?s?|m|min(?:ute)?s?|h|hours?)\\b"\n)\n'''
          insert = marker + '''_IMPLEMENTATION_ADVICE = re.compile(\n    r"(?i)\\b(?:check|ensure|review|inspect|audit|verify)\\b[^.!?\\n]{0,240}"\n    r"(?:complex loops?|external api calls?|trigger(?:ed)?\\s+by|non[- ]blocking)"\n)\n'''
          assert marker in text
          text = text.replace(marker, insert, 1)
          old = '''def _unsafe_recommendation(text: str) -> bool:\n    comparable = re.sub(r"[*_`]", "", str(text or ""))\n    if _RULE_EVENT_PRESCRIPTION.search(comparable) or _RULE_NUMERIC_CADENCE.search(comparable):\n        return True\n    if _NUMERIC_TUNING.search(comparable) and _DIRECTIVE.search(comparable):\n        return True\n    return bool(_DIRECTIVE.search(comparable) and _CONFIG_TOPIC.search(comparable))\n'''
          new = '''def _unsafe_recommendation(text: str) -> bool:\n    comparable = re.sub(r"[*_`\\\"“”]", "", str(text or ""))\n    if _RULE_EVENT_PRESCRIPTION.search(comparable) or _RULE_NUMERIC_CADENCE.search(comparable):\n        return True\n    if _IMPLEMENTATION_ADVICE.search(comparable):\n        return True\n    if _NUMERIC_TUNING.search(comparable) and _DIRECTIVE.search(comparable):\n        return True\n    return bool(_DIRECTIVE.search(comparable) and _CONFIG_TOPIC.search(comparable))\n'''
          assert old in text
          text = text.replace(old, new, 1)
          helper_anchor = '''def _split_sentences(text: str) -> list[str]:\n    return re.split(r"(?<=[.!?])(\\s+)", text)\n'''
          helper_new = helper_anchor + '''\n\ndef _dedupe_inspection_guidance(text: str) -> str:\n    first = text.find("Inspect the cited")\n    if first < 0:\n        return text\n    second = text.find("Inspect the cited", first + 1)\n    if second < 0:\n        return text\n    return text[:second].rstrip()\n'''
          assert helper_anchor in text
          text = text.replace(helper_anchor, helper_new, 1)
          old = '''    return "".join(pieces) if changed else line\n'''
          new = '''    rewritten = "".join(pieces) if changed else line\n    return _dedupe_inspection_guidance(rewritten)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 4) Exact 0.16.59 regressions.
          test = root / 'tests/test_performance_grounding_0_16_59.py'
          test.write_text(r'''from __future__ import annotations

import sys
from pathlib import Path
from types import SimpleNamespace

APP_DIR = Path(__file__).resolve().parents[1] / "hubitat-mcp-ai" / "rootfs" / "app"
sys.path.insert(0, str(APP_DIR))

from api_response_builder import build_agent_response  # noqa: E402
from grounding_policy import GroundingAction, GroundingPolicy  # noqa: E402
from performance_semantic_grounding import ground_performance_semantics  # noqa: E402


def _performance_evidence() -> list[dict[str, object]]:
    return [
        {"tool": "hub_read_diagnostics", "sub_tool": "hub_get_metrics", "success": True},
        {"tool": "hub_read_diagnostics", "sub_tool": "hub_get_performance_stats", "success": True},
        {"tool": "hub_manage_logs", "sub_tool": "hub_get_logs", "success": True},
    ]


def test_hub_manage_logs_hub_get_logs_satisfies_log_grounding() -> None:
    policy = GroundingPolicy.default(logs_requested=True, conversational=False)
    arguments = {"tool": "hub_get_logs", "args": {"since": "30m", "limit": 100}}

    assert policy.is_live_log_call("hub_manage_logs", arguments) is True
    policy.record_tool_outcome("hub_manage_logs", arguments, success=True)

    decision = policy.decide_no_tool_calls(has_live_evidence=True)
    assert decision.action is GroundingAction.ACCEPT
    assert policy.logs_checked is True


def test_direct_hub_get_logs_also_satisfies_log_grounding() -> None:
    policy = GroundingPolicy.default(logs_requested=True, conversational=False)
    policy.record_tool_outcome("hub_get_logs", {"since": "30m"}, success=True)
    assert policy.decide_no_tool_calls(has_live_evidence=True).action is GroundingAction.ACCEPT


def test_false_no_performance_data_answer_is_corrected_at_serialization() -> None:
    outcome = SimpleNamespace(
        message=(
            "The current-turn evidence does not provide the necessary data to analyze hub performance, "
            "review logs, or recommend improvements. No metrics, performance statistics, or log entries "
            "were returned in the provided results."
        ),
        route="unified-mcp-agent",
        request_class="live-read",
        evidence=_performance_evidence(),
        metrics={"outcome": "success", "counters": {"model_rounds": 5}},
        choices=[],
        confirmation_required=False,
        confirmation_count=0,
        automation_items=[],
    )

    response = build_agent_response(outcome, model="gemma4:31b", elapsed_ms=100, version="0.16.59")
    message = response["message"]
    assert "does not provide the necessary data" not in message
    assert "No metrics, performance statistics, or log entries were returned" not in message
    assert "successful hub metrics, performance statistics and logs" in message


def test_live_01658_performance_wording_is_structurally_grounded() -> None:
    draft = '''### ⚠️ Performance Bottlenecks (Measured)

**1. Critical Execution Delay: LG webOS TV**
* **Finding:** This device has an average execution time of **3,084ms (over 3 seconds)**.
* **Impact:** In Hubitat, long execution times like this are typically "blocking" calls. When this driver runs, it can pause other hub activities, leading to perceived lag in your automations.

### 🛠️ Recommended Improvements

1. **Optimize the LG webOS TV Driver:**
   * **Hypothesis:** The 3-second delay is likely caused by a network timeout or a synchronous HTTP request to the TV.
   * **Action:** Check the driver settings for any "polling" intervals and increase them. If you are using a community driver, check for updates or a "non-blocking" version.
2. **Audit SenseCap D1 Settings:**
Inspect the cited integration/device configuration first. Recent activity can justify a tuning review, but this turn did not read the relevant settings needed to prescribe an exact polling/reporting threshold, interval, or frequency. Inspect the cited component configuration first. Recent activity can justify a tuning review, but this turn did not read the relevant settings needed to prescribe an exact configuration change.
3. **Review MCP Rule Server & Watchtower:**
   * **Action:** Since these have execution times nearing 1 second, check if they are performing complex loops or external API calls. Ensure they aren't triggered by the chatty devices mentioned above.
'''

    corrected = ground_performance_semantics(draft)
    assert "3,084ms" in corrected
    assert 'typically "blocking" calls' not in corrected
    assert "pause other hub activities" not in corrected
    assert "likely caused by a network timeout" not in corrected
    assert '"polling" intervals and increase them' not in corrected
    assert '"non-blocking" version' not in corrected
    assert "complex loops or external API calls" not in corrected
    assert "Ensure they aren't triggered" not in corrected
    sensecap_line = next(line for line in corrected.splitlines() if line.startswith("Inspect the cited"))
    assert sensecap_line.count("Inspect the cited") == 1


def test_recommended_improvements_is_an_action_heading() -> None:
    draft = '''### 🛠️ Recommended Improvements
| Component | Action | Expected Impact |
| :--- | :--- | :--- |
| LG | Check the driver settings for any "polling" intervals and increase them. | Lower lag |
'''
    corrected = ground_performance_semantics(draft)
    assert "| LG | Inspect the cited integration/device configuration first." in corrected
    assert "increase them" not in corrected
''')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-0-16-59.yml
