name: Build 0.16.102 cleanup history persistence

on:
  push:
    paths:
      - ".github/workflows/build_0_16_102_cleanup_history.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cleanup-history-persistence-0.16.102
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Apply 0.16.102 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('hubitat-mcp-ai/rootfs/app/one_time_rule_cleanup.py')
          s = p.read_text()
          s = s.replace('import asyncio\nimport logging\nimport re\n', 'import asyncio\nimport json\nimport logging\nimport re\n')
          s = s.replace('from datetime import datetime, timedelta\nfrom typing import Any, Awaitable, Callable\n', 'from datetime import datetime, timedelta\nfrom pathlib import Path\nfrom typing import Any, Awaitable, Callable\n')

          old_sig = '''        daily_time: str,\n        local_now: Callable[[], Awaitable[datetime]],\n    ) -> None:\n'''
          new_sig = '''        daily_time: str,\n        local_now: Callable[[], Awaitable[datetime]],\n        state_path: Path | str | None = None,\n    ) -> None:\n'''
          if old_sig not in s:
              raise SystemExit('scheduler signature anchor missing')
          s = s.replace(old_sig, new_sig, 1)

          old_state = '''        self._local_now = local_now\n        self._task: asyncio.Task[Any] | None = None\n        self._run_lock = asyncio.Lock()\n        self.next_run: str | None = None\n        self.last_run: str | None = None\n        self.last_trigger: str | None = None\n        self.last_result: OneTimeRuleCleanupResult | None = None\n\n    def status(self) -> dict[str, Any]:\n'''
          new_state = '''        self._local_now = local_now\n        self._task: asyncio.Task[Any] | None = None\n        self._run_lock = asyncio.Lock()\n        self.next_run: str | None = None\n        self.last_run: str | None = None\n        self.last_trigger: str | None = None\n        self.last_result: OneTimeRuleCleanupResult | None = None\n        self.state_path = Path(state_path) if state_path else None\n        self.persistence_error: str | None = None\n        self._configuration_error = self.last_error\n        self._restore_state()\n\n    @staticmethod\n    def _result_from_payload(value: Any) -> OneTimeRuleCleanupResult | None:\n        if not isinstance(value, dict):\n            return None\n        checked_at = str(value.get("checked_at") or "").strip()\n        if not checked_at:\n            return None\n        deleted = [dict(item) for item in value.get("deleted", []) if isinstance(item, dict)]\n        failed = [dict(item) for item in value.get("failed", []) if isinstance(item, dict)]\n        try:\n            scanned = max(0, int(value.get("scanned") or 0))\n            eligible = max(0, int(value.get("eligible") or 0))\n        except (TypeError, ValueError):\n            return None\n        list_error = str(value.get("list_error") or "").strip() or None\n        return OneTimeRuleCleanupResult(\n            checked_at=checked_at,\n            scanned=scanned,\n            eligible=eligible,\n            deleted=deleted,\n            failed=failed,\n            list_error=list_error,\n        )\n\n    def _restore_state(self) -> None:\n        if self.state_path is None or not self.state_path.exists():\n            return\n        try:\n            payload = json.loads(self.state_path.read_text(encoding="utf-8"))\n            if not isinstance(payload, dict) or payload.get("schema_version") != 1:\n                raise ValueError("unsupported cleanup state schema")\n            restored = self._result_from_payload(payload.get("last_result"))\n            self.last_result = restored\n            self.last_run = str(payload.get("last_run") or "").strip() or (restored.checked_at if restored else None)\n            self.last_trigger = str(payload.get("last_trigger") or "").strip() or None\n            if self._configuration_error is None:\n                self.last_error = str(payload.get("last_error") or "").strip() or None\n            self.persistence_error = None\n            logger.info(\n                "One-time cleanup history restored: last_run=%s trigger=%s deleted=%s failed=%s",\n                self.last_run or "none",\n                self.last_trigger or "none",\n                len(restored.deleted) if restored else 0,\n                len(restored.failed) if restored else 0,\n            )\n        except Exception as exc:\n            self.persistence_error = f"{type(exc).__name__}: {str(exc)[:300]}"\n            logger.warning("Could not restore one-time cleanup history: %s", exc)\n\n    def _persist_state(self) -> None:\n        if self.state_path is None:\n            return\n        payload = {\n            "schema_version": 1,\n            "last_run": self.last_run,\n            "last_trigger": self.last_trigger,\n            "last_error": self.last_error,\n            "last_result": self.last_result.as_dict() if self.last_result else None,\n        }\n        try:\n            self.state_path.parent.mkdir(parents=True, exist_ok=True)\n            temp = self.state_path.with_suffix(self.state_path.suffix + ".tmp")\n            temp.write_text(\n                json.dumps(payload, ensure_ascii=False, indent=2),\n                encoding="utf-8",\n            )\n            temp.replace(self.state_path)\n            self.persistence_error = None\n        except Exception as exc:\n            self.persistence_error = f"{type(exc).__name__}: {str(exc)[:300]}"\n            logger.warning("Could not persist one-time cleanup history: %s", exc)\n\n    def status(self) -> dict[str, Any]:\n'''
          if old_state not in s:
              raise SystemExit('scheduler state anchor missing')
          s = s.replace(old_state, new_state, 1)

          status_anchor = '''            "last_error": self.last_error,\n            "running": self._run_lock.locked(),\n'''
          status_repl = '''            "last_error": self.last_error,\n            "persistence_error": self.persistence_error,\n            "history_persisted": bool(self.state_path),\n            "running": self._run_lock.locked(),\n'''
          if status_anchor not in s:
              raise SystemExit('status anchor missing')
          s = s.replace(status_anchor, status_repl, 1)

          exc_anchor = '''                self.last_error = f"{type(exc).__name__}: {str(exc)[:300]}"\n                self.last_trigger = trigger\n                logger.exception("One-time rule cleanup failed: trigger=%s", trigger)\n                raise\n'''
          exc_repl = '''                self.last_error = f"{type(exc).__name__}: {str(exc)[:300]}"\n                self.last_trigger = trigger\n                self._persist_state()\n                logger.exception("One-time rule cleanup failed: trigger=%s", trigger)\n                raise\n'''
          if exc_anchor not in s:
              raise SystemExit('run exception anchor missing')
          s = s.replace(exc_anchor, exc_repl, 1)

          success_anchor = '''            self.last_trigger = trigger\n            self.last_error = result.list_error\n            logger.info(\n'''
          success_repl = '''            self.last_trigger = trigger\n            self.last_error = result.list_error\n            self._persist_state()\n            logger.info(\n'''
          if success_anchor not in s:
              raise SystemExit('run success anchor missing')
          s = s.replace(success_anchor, success_repl, 1)
          p.write_text(s)

          p = Path('hubitat-mcp-ai/rootfs/app/app.py')
          s = p.read_text()
          anchor = '''    daily_time=str(OPTIONS.get("one_time_rule_cleanup_time") or "01:00"),\n    local_now=_health_scheduler_now,\n)\n'''
          repl = '''    daily_time=str(OPTIONS.get("one_time_rule_cleanup_time") or "01:00"),\n    local_now=_health_scheduler_now,\n    state_path=Path(\n        os.getenv(\n            "ONE_TIME_RULE_CLEANUP_STATE_PATH",\n            "/data/homebrain-one-time-rule-cleanup.json",\n        )\n    ),\n)\n'''
          if anchor not in s:
              raise SystemExit('app scheduler anchor missing')
          s = s.replace(anchor, repl, 1)
          p.write_text(s)

          p = Path('hubitat-mcp-ai/tests/test_one_time_rule_cleanup.py')
          s = p.read_text()
          if 'test_cleanup_history_survives_scheduler_restart' not in s:
              s += '''\n\n@pytest.mark.asyncio\nasync def test_cleanup_history_survives_scheduler_restart(tmp_path) -> None:\n    state_path = tmp_path / "cleanup-state.json"\n    mcp = FakeMCP()\n    service = OneTimeRuleCleanupService(mcp, local_now=local_now, grace_minutes=10)\n    first = OneTimeRuleCleanupScheduler(\n        service,\n        enabled=True,\n        daily_time="15:15",\n        local_now=local_now,\n        state_path=state_path,\n    )\n\n    result = await first.run_now()\n    assert state_path.exists()\n    assert result.deleted\n\n    restarted = OneTimeRuleCleanupScheduler(\n        service,\n        enabled=True,\n        daily_time="17:15",\n        local_now=local_now,\n        state_path=state_path,\n    )\n    status = restarted.status()\n\n    assert status["time"] == "17:15"\n    assert status["last_run"] == result.checked_at\n    assert status["last_trigger"] == "manual"\n    assert status["last_result"]["deleted_count"] == 2\n    assert status["last_result"]["failed_count"] == 0\n    assert status["history_persisted"] is True\n    assert status["persistence_error"] is None\n\n\ndef test_cleanup_corrupt_persisted_state_does_not_block_scheduler(tmp_path) -> None:\n    state_path = tmp_path / "cleanup-state.json"\n    state_path.write_text("not-json", encoding="utf-8")\n    mcp = FakeMCP()\n    service = OneTimeRuleCleanupService(mcp, local_now=local_now, grace_minutes=10)\n    scheduler = OneTimeRuleCleanupScheduler(\n        service,\n        enabled=True,\n        daily_time="17:15",\n        local_now=local_now,\n        state_path=state_path,\n    )\n\n    status = scheduler.status()\n    assert status["last_run"] is None\n    assert status["persistence_error"]\n    assert status["time"] == "17:15"\n'''
          p.write_text(s)

          Path('hubitat-mcp-ai/CHANGELOG-0.16.102.md').write_text('''# Hubitat MCP AI 0.16.102\n\n## Persistent one-time cleanup history\n\n- Persists the latest one-time cleanup result under `/data/homebrain-one-time-rule-cleanup.json`.\n- Restores last run, trigger, scanned/eligible/deleted/failed counts, deleted/failed rule details, and last cleanup error after add-on restart.\n- Changing the configured cleanup schedule no longer clears the previous cleanup history shown in the HomeBrain UI.\n- Uses an atomic temporary-file replace, matching HomeBrain's existing health-audit persistence pattern.\n- Corrupt or unreadable persisted state is reported as a persistence error but does not stop the scheduler.\n- Cleanup eligibility/deletion safety is unchanged.\n''')

          p = Path('hubitat-mcp-ai/config.yaml')
          s = p.read_text().replace('version: "0.16.101"', 'version: "0.16.102"', 1)
          p.write_text(s)

          for name in ('README.md', 'hubitat-mcp-ai/README.md'):
              p = Path(name)
              s = p.read_text()
              s = s.replace('0.16.101', '0.16.102', 1)
              p.write_text(s)

          p = Path('hubitat-mcp-ai/CHANGELOG-INDEX.md')
          s = p.read_text()
          s = s.replace('- [0.16.101](CHANGELOG-0.16.101.md)', '- [0.16.102](CHANGELOG-0.16.102.md)\n\n- [0.16.101](CHANGELOG-0.16.101.md)', 1)
          p.write_text(s)
          PY
      - name: Compile runtime
        run: python -m compileall -q hubitat-mcp-ai/rootfs/app
      - name: Focused persistence tests
        run: python -m pytest -q hubitat-mcp-ai/tests/test_one_time_rule_cleanup.py hubitat-mcp-ai/tests/test_cleanup_webui_contract.py
      - name: Full blocking release gate
        run: python scripts/run_release_gate.py
      - name: Commit final branch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/build_0_16_102_cleanup_history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "HomeBrain 0.16.102: persist cleanup history"
          git push origin HEAD:fix/cleanup-history-persistence-0.16.102
