name: Stage 4K matched Qwen 3B vs 7B extraction (synthetic)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4k-matched-3b-7b.yml'
      - 'hubitat-mcp-ai/tools/stage4k_github_matched_models.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_prose_atom_coverage.py'
      - 'hubitat-mcp-ai/tools/stage4j_github_prose_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4k-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matched-local-models:
    name: Actual Qwen 3B and 7B, matched source & held-out tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '3072'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm source-only isolation and Python syntax
        run: |
          set -euo pipefail
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          test "$OLLAMA_NO_CLOUD" = "1"
          python -m compileall -q hubitat-mcp-ai/tools/stage4k_github_matched_models.py
          python -m compileall -q hubitat-mcp-ai/tools/stage4j_github_prose_coverage.py
      - name: Install public Ollama on temporary GitHub runner
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/ollama-stage4k-install.sh
          sh /tmp/ollama-stage4k-install.sh
          ollama --version
      - name: Start isolated CPU Ollama (no cloud)
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4k-local-ollama.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Local Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local Ollama did not start"
          exit 1
      - name: Pull same-family 3B and 7B local public weights
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama pull qwen2.5:7b
          ollama list | grep -F 'qwen2.5:3b'
          ollama list | grep -F 'qwen2.5:7b'
      - name: Run 40 actual matched semantic extraction calls and compare
        timeout-minutes: 70
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4k_github_matched_models.py \
            --ack-github-synthetic-local-inference --timeout-seconds 180
      - name: Report source-only invariant
        if: always()
        run: |
          echo "Synthetic evidence, fixed prompts; no private household input."
          echo "No Hubitat, HA, MCP, live agent, model publisher, secrets or devices."
