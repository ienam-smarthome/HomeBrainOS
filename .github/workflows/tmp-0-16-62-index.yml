name: Temporary 0.16.62 index repair

on:
  push:
    branches:
      - agent/performance-metrics-compat-0-16-62

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-metrics-compat-0-16-62
          fetch-depth: 0
      - name: Add current release to changelog index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hubitat-mcp-ai/CHANGELOG-INDEX.md')
          text = p.read_text()
          new = '- [0.16.62](CHANGELOG-0.16.62.md)\n'
          if new not in text:
              anchor = '## Current release\n\n'
              if anchor not in text:
                  raise SystemExit('current release anchor missing')
              text = text.replace(anchor, anchor + new, 1)
              p.write_text(text)
          Path('.github/workflows/tmp-0-16-62-index.yml').unlink()
          PY
      - name: Commit index repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: index HomeBrain 0.16.62 release notes"
          git push origin HEAD:agent/performance-metrics-compat-0-16-62
