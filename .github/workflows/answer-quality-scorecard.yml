name: Answer quality scorecard integrity (not a model score)

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/ANSWER-QUALITY-*.md'
      - 'tests/fixtures/answer_quality_cases_v1.json'
      - 'tests/fixtures/homebrain_golden_tasks_v1.json'
      - 'tests/test_answer_quality_scorecard.py'
      - 'scripts/answer_quality_scorecard.py'
      - 'scripts/answer_quality_capture.py'
      - 'scripts/answer_quality_fixed_packets.py'
      - 'scripts/answer_quality_comparison_prompt.py'
      - 'hubitat-mcp-ai/rootfs/app/publication_boundary_shadow.py'
      - 'tests/test_q1_publication_boundary_shadow.py'
      - 'hubitat-mcp-ai/rootfs/app/answer_publication_policy.py'
      - 'hubitat-mcp-ai/rootfs/app/typed_device_history_evidence.py'
      - 'tests/test_q3_evidence_publication_policy.py'
      - 'tests/test_q3_single_device_read_scope.py'
      - 'tests/test_q3_driver_source_identity_guard.py'
      - 'hubitat-mcp-ai/rootfs/app/driver_source_identity_guard.py'
      - 'hubitat-mcp-ai/rootfs/app/single_device_read_scope.py'
      - 'tests/test_answer_quality_capture.py'
      - 'tests/test_answer_quality_fixed_packets.py'
      - '.github/workflows/answer-quality-scorecard.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review schema and anti-fabrication behavior
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_answer_quality_scorecard.py tests/test_answer_quality_capture.py tests/test_answer_quality_fixed_packets.py tests/test_q1_publication_boundary_shadow.py tests/test_q3_evidence_publication_policy.py tests/test_q3_single_device_read_scope.py tests/test_q3_driver_source_identity_guard.py
      - name: Verify frozen offline packet manifest (not model scores)
        run: |
          python scripts/answer_quality_fixed_packets.py export --output answer-quality-frozen-packets.jsonl
          python -c "import json; p=[json.loads(l) for l in open('answer-quality-frozen-packets.jsonl')]; assert len(p)==18 and all('required_findings' not in c and 'forbidden_claims' not in c for c in p)"
      - name: Verify neutral Claude/Gemma evidence-only prompt has no private rubric
        run: |
          python scripts/answer_quality_comparison_prompt.py --case-id aq_network_broker_vs_device_health > fixed-neutral-model-prompt.txt
          python -c "p=open('fixed-neutral-model-prompt.txt').read(); assert 'Frozen packet SHA-256:' in p and 'Do not call MCP' in p and 'required_findings' not in p and 'forbidden_claims' not in p"
      - name: Produce an honestly unmeasured starting scorecard
        run: |
          python scripts/answer_quality_scorecard.py --output answer-quality-scorecard.json
          python -c "import json; r=json.load(open('answer-quality-scorecard.json')); assert r['measurement_status']=='not_measured' and r['models']==[] and r['total_defined_cases']==31"
      - uses: actions/upload-artifact@v4
        with:
          name: answer-quality-scorecard-unmeasured
          path: answer-quality-scorecard.json
          retention-days: 30
