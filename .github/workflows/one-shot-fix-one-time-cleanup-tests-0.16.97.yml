name: One-shot 0.16.97 stale test cleanup
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-one-time-cleanup-tests-0.16.97.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-time-rule-cleanup-0.16.97
      - name: Update stale self-pause regressions
        run: python .github/scripts/fix_one_time_cleanup_tests_01697.py
      - name: Remove one-shot files
        run: |
          rm .github/scripts/fix_one_time_cleanup_tests_01697.py
          rm .github/workflows/one-shot-fix-one-time-cleanup-tests-0.16.97.yml
      - name: Commit test cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align 0.16.97 tests with nightly cleanup lifecycle"
          git push origin HEAD:feat/one-time-rule-cleanup-0.16.97
