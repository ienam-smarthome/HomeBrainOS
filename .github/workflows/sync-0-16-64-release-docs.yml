name: Sync 0.16.64 release docs

on:
  push:
    branches:
      - agent/performance-grounding-0-16-64

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-grounding-0-16-64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync release documentation
        run: python scripts/sync_0_16_64_release_docs.py
      - name: Commit synced docs
        shell: bash
        run: |
          if git diff --quiet -- hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md
          git commit -m "Sync 0.16.64 release documentation"
          git push origin HEAD:agent/performance-grounding-0-16-64
