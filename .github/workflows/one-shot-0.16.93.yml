name: One-shot 0.16.93 capability resolver fix

on:
  push:
    branches:
      - fix/capability-resolver-fallback-0.16.93

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-resolver-fallback-0.16.93
          fetch-depth: 0
      - name: Apply resolver fix and release packaging
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git rm .github/workflows/one-shot-0.16.93.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md hubitat-mcp-ai
          git commit -m "HomeBrain 0.16.93: capability-grounded resolver fallback"
          git push origin HEAD:fix/capability-resolver-fallback-0.16.93
