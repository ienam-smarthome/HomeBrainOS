name: Stage 4F stronger offline AI reviewers (synthetic only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4f-stronger-model-evaluation.yml'
      - 'hubitat-mcp-ai/tools/stage4f_github_stronger_models.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4f-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stronger-reviewers:
    name: CPU-only Qwen2.5 3B vs Llama 3.2 3B
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_CONTEXT_LENGTH: '3072'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated synthetic-only harness
        run: |
          set -euo pipefail
          test "$OLLAMA_NO_CLOUD" = "1"
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          python -m compileall -q hubitat-mcp-ai/tools/stage4f_github_stronger_models.py
          python -m compileall -q hubitat-mcp-ai/rootfs/app/stage4_offline_model_evaluation.py
      - name: Install official Ollama
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/stage4f-ollama-installer.sh
          sh /tmp/stage4f-ollama-installer.sh
          ollama --version
      - name: Start no-cloud loopback inference
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4f-ollama-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Isolated local Ollama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local Ollama not ready"
          exit 1
      - name: Pull Qwen2.5 3B and Llama 3.2 3B local public weights
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama pull llama3.2:3b
          ollama list
          ollama list | grep -F 'qwen2.5:3b'
          ollama list | grep -F 'llama3.2:3b'
      - name: Run independent 3B semantic reviews and count false rejections
        timeout-minutes: 38
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4f_github_stronger_models.py \
            --ack-github-synthetic-local-inference --timeout-seconds 120
      - name: Confirm production safeguards
        if: always()
        run: |
          echo "Synthetic only: no Hubitat/HA secrets, endpoints, or user files."
          echo "No HomeBrain runtime integration or model publisher activation."
