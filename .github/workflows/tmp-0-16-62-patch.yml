name: Temporary 0.16.62 patch

on:
  push:
    branches:
      - agent/performance-metrics-compat-0-16-62

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-metrics-compat-0-16-62
          fetch-depth: 0
      - name: Apply 0.16.62 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          semantic_path = root / 'hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py'
          semantic = semantic_path.read_text()
          old_relation = r'''r"(?i)\b(?:is|are|was|were)\s+(?:the\s+)?(?:primary|main|major|direct)\s+"'''
          new_relation = r'''r"(?i)\b(?:is|are|was|were)\s+(?:(?:likely|probably|clearly|directly)\s+)?(?:the\s+)?(?:primary|main|major|direct)\s+"'''
          relation_count = semantic.count(old_relation)
          if relation_count != 2:
              raise SystemExit(f'expected 2 outcome relation patterns, found {relation_count}')
          semantic = semantic.replace(old_relation, new_relation)
          old_prefix = '''            prefix = sentence[: raw_relation.start()].rstrip(" ,;:-")\n            if prefix:\n                return (\n                    prefix\n                    + "; this is a measured performance concern, but the current statistics do not establish "\n                    + "that it causes hub lag, stutter, congestion, or instability."\n                )'''
          new_prefix = '''            prefix = sentence[: raw_relation.start()].rstrip(" ,;:-")\n            prefix = re.sub(r"(?i)\\b(?:and|which|so|therefore|thus)\\s*$", "", prefix).rstrip(" ,;:-")\n            has_measurement = re.search(\n                r"(?i)(?:\\d[\\d,.]*(?:-\\d[\\d,.]*)?\\s*(?:%|ms|s|sec(?:ond)?s?|mb)|"\n                r"\\d[\\d,.]*\\s+calls?\\b|\\bmeasured load\\b)",\n                re.sub(r"[*_`]", "", prefix),\n            )\n            if prefix and has_measurement:\n                return (\n                    prefix\n                    + "; this is a measured performance concern, but the current statistics do not establish "\n                    + "that it causes hub lag, stutter, congestion, or instability."\n                )'''
          if old_prefix not in semantic:
              raise SystemExit('outcome prefix block not found')
          semantic = semantic.replace(old_prefix, new_prefix, 1)
          semantic_path.write_text(semantic)

          compat_path = root / 'hubitat-mcp-ai/rootfs/app/performance_result_compat.py'
          compat_path.write_text('''"""Compatibility normalization for known upstream performance-result defects."""\n\nfrom __future__ import annotations\n\nimport re\nfrom typing import Any\n\nfrom mcp_client import MCPToolResult\n\n_PERFORMANCE_TOOL = "hub_get_performance_stats"\n_NUMERIC = re.compile(r"^[+-]?\\d+(?:\\.\\d+)?$")\n\n\ndef _numeric_database_value(value: Any) -> bool:\n    if isinstance(value, bool):\n        return False\n    if isinstance(value, (int, float)):\n        return True\n    return isinstance(value, str) and bool(_NUMERIC.fullmatch(value.strip()))\n\n\ndef _normalize_database_size(value: Any) -> Any:\n    if isinstance(value, list):\n        return [_normalize_database_size(item) for item in value]\n    if not isinstance(value, dict):\n        return value\n    normalized = {key: _normalize_database_size(item) for key, item in value.items()}\n    if "databaseSizeMB" in normalized:\n        return normalized\n    raw = normalized.get("databaseSizeKB")\n    if not _numeric_database_value(raw):\n        return normalized\n    normalized.pop("databaseSizeKB", None)\n    normalized["databaseSizeMB"] = raw\n    normalized["databaseSizeRaw"] = {\n        "field": "databaseSizeKB",\n        "value": raw,\n        "note": (\n            "Legacy upstream MCP label retained here for provenance. On the affected "\n            "server version /hub/advanced/databaseSize supplies the numeric MB value; "\n            "HomeBrain preserves that number without multiplying or dividing it."\n        ),\n    }\n    return normalized\n\n\ndef normalize_performance_result(\n    name: str, arguments: dict[str, Any], result: MCPToolResult\n) -> MCPToolResult:\n    """Relabel the affected performance database metric without changing its value."""\n    sub_tool = str(arguments.get("tool") or "") if isinstance(arguments, dict) else ""\n    if name != _PERFORMANCE_TOOL and sub_tool != _PERFORMANCE_TOOL:\n        return result\n    if result.is_error or not isinstance(result.data, dict):\n        return result\n    normalized = _normalize_database_size(result.data)\n    if normalized == result.data:\n        return result\n    return MCPToolResult(\n        name=result.name,\n        arguments=result.arguments,\n        raw=result.raw,\n        text=result.text,\n        data=normalized,\n        is_error=result.is_error,\n    )\n''')

          executor_path = root / 'hubitat-mcp-ai/rootfs/app/tool_executor.py'
          executor = executor_path.read_text()
          import_anchor = 'from mcp_client import tool_succeeded as _shared_tool_succeeded\n'
          if import_anchor not in executor:
              raise SystemExit('tool_executor import anchor missing')
          executor = executor.replace(import_anchor, import_anchor + 'from performance_result_compat import normalize_performance_result\n', 1)
          call_anchor = '''            result = (\n                await handler(safe_arguments)\n                if handler is not None\n                else await self.mcp.call_tool(name, safe_arguments)\n            )\n            # Semantic history may be requested without an explicit binary state'''
          call_replacement = '''            result = (\n                await handler(safe_arguments)\n                if handler is not None\n                else await self.mcp.call_tool(name, safe_arguments)\n            )\n            result = normalize_performance_result(name, safe_arguments, result)\n            # Semantic history may be requested without an explicit binary state'''
          if call_anchor not in executor:
              raise SystemExit('tool_executor result anchor missing')
          executor = executor.replace(call_anchor, call_replacement, 1)
          executor_path.write_text(executor)

          (root / 'tests/test_performance_grounding_0_16_62.py').write_text('''from performance_semantic_grounding import ground_performance_semantics\n\n\ndef test_likely_primary_source_localization_keeps_metric_without_dangling_relation():\n    draft = "LG webOS TV averaged 3,073ms and is likely the primary source of hub stutter."\n    corrected = ground_performance_semantics(draft)\n    assert "3,073ms" in corrected\n    assert "is likely the;" not in corrected\n    assert "and;" not in corrected\n    assert corrected.startswith("LG webOS TV averaged 3,073ms;")\n    assert "current statistics do not establish" in corrected\n\n\ndef test_outcome_localization_does_not_preserve_unmeasured_prefix_as_measured_fact():\n    draft = "LG webOS TV is likely the primary source of hub stutter."\n    corrected = ground_performance_semantics(draft)\n    assert not corrected.startswith("LG webOS TV;")\n    assert corrected.startswith("This is a measured performance concern")\n''')

          (root / 'tests/test_performance_result_compat_0_16_62.py').write_text('''from mcp_client import MCPToolResult\nfrom performance_result_compat import normalize_performance_result\n\n\ndef _result(data):\n    return MCPToolResult(name="hub_read_system", arguments={"tool": "hub_get_performance_stats", "args": {}}, raw=None, text="", data=data, is_error=False)\n\n\ndef test_legacy_database_size_label_is_relabelled_without_scaling_and_raw_is_preserved():\n    result = _result({"current": {"databaseSizeKB": "166", "freeMemoryKB": 200000}, "trends": [{"databaseSizeKB": "165"}]})\n    normalized = normalize_performance_result("hub_read_system", {"tool": "hub_get_performance_stats", "args": {}}, result)\n    assert normalized.data["current"]["databaseSizeMB"] == "166"\n    assert "databaseSizeKB" not in normalized.data["current"]\n    assert normalized.data["current"]["databaseSizeRaw"]["field"] == "databaseSizeKB"\n    assert normalized.data["current"]["databaseSizeRaw"]["value"] == "166"\n    assert normalized.data["trends"][0]["databaseSizeMB"] == "165"\n\n\ndef test_future_correct_database_size_mb_shape_is_unchanged():\n    result = _result({"current": {"databaseSizeMB": "166"}})\n    normalized = normalize_performance_result("hub_read_system", {"tool": "hub_get_performance_stats"}, result)\n    assert normalized is result\n\n\ndef test_non_numeric_legacy_value_is_left_untouched():\n    result = _result({"current": {"databaseSizeKB": "unavailable"}})\n    normalized = normalize_performance_result("hub_read_system", {"tool": "hub_get_performance_stats"}, result)\n    assert normalized is result\n    assert normalized.data["current"]["databaseSizeKB"] == "unavailable"\n\n\ndef test_unrelated_tool_result_is_untouched():\n    result = _result({"current": {"databaseSizeKB": "166"}})\n    normalized = normalize_performance_result("hub_read_system", {"tool": "hub_get_logs"}, result)\n    assert normalized is result\n''')

          module_map_path = root / 'docs/RUNTIME-MODULE-MAP.md'
          module_map = module_map_path.read_text()
          map_anchor = '| `performance_causality_guard.py` | Prevents recent log activity from being promoted into the cause of longer-window performance statistics without direct linking evidence, and blocks unsupported threshold/edit prescriptions. |\n'
          map_row = '| `performance_result_compat.py` | Applies narrow, provenance-preserving compatibility normalization to known malformed upstream performance result fields. |\n'
          if map_anchor not in module_map:
              raise SystemExit('runtime map anchor missing')
          module_map_path.write_text(module_map.replace(map_anchor, map_anchor + map_row, 1))

          config_path = root / 'hubitat-mcp-ai/config.yaml'
          config = config_path.read_text()
          if 'version: "0.16.61"' not in config:
              raise SystemExit('config version anchor missing')
          config_path.write_text(config.replace('version: "0.16.61"', 'version: "0.16.62"', 1))

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          old_component = '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.61 | Maintained |'
          if old_component not in readme:
              raise SystemExit('root README version anchor missing')
          readme_path.write_text(readme.replace(old_component, old_component.replace('0.16.61', '0.16.62'), 1))

          addon_readme_path = root / 'hubitat-mcp-ai/README.md'
          addon_readme = addon_readme_path.read_text()
          if 'Current add-on version: **0.16.61**.' not in addon_readme:
              raise SystemExit('add-on README version anchor missing')
          addon_readme = addon_readme.replace('Current add-on version: **0.16.61**.', 'Current add-on version: **0.16.62**.', 1)
          architecture_anchor = '## Architecture\n\n'
          architecture_note = '''0.16.62 fixes two defects exposed by the 0.16.61 live performance retest. Outcome-causality localization now preserves only a complete measured prefix, so wording such as `is likely the primary source of hub stutter` cannot collapse into a dangling `is likely the;` fragment. The performance tool boundary also applies a narrow compatibility relabel for the upstream `databaseSizeKB` field: on the affected MCP server version `/hub/advanced/databaseSize` supplies the numeric MB value, so HomeBrain exposes `databaseSizeMB` without scaling and retains the legacy field/value as raw provenance. Future native `databaseSizeMB` results and non-numeric legacy values are left untouched. No additional Hubitat calls are introduced.\n\n'''
          if architecture_anchor not in addon_readme:
              raise SystemExit('add-on README architecture anchor missing')
          addon_readme_path.write_text(addon_readme.replace(architecture_anchor, architecture_anchor + architecture_note, 1))

          (root / 'hubitat-mcp-ai/CHANGELOG-0.16.62.md').write_text('''# Hubitat MCP AI 0.16.62\n\n## Performance wording and metric compatibility\n\n- Outcome-causality localization now starts at the full certainty/relation phrase and strips a trailing conjunction before preserving a measured prefix, preventing malformed output such as `is likely the; ...`.\n- A prefix is retained as a measured fact only when it actually contains bounded numeric/measured evidence; otherwise the whole unsupported causal sentence is replaced with the existing neutral grounding statement.\n- `hub_get_performance_stats` receives a narrow compatibility normalization for the affected upstream `databaseSizeKB` label. The numeric value is preserved without scaling and exposed as `databaseSizeMB`, while `databaseSizeRaw` retains the legacy field name and value for provenance.\n- Future upstream results that already provide `databaseSizeMB`, non-numeric legacy values, failed tool calls, and unrelated tool results remain untouched.\n- No additional Hubitat calls are introduced.\n\n## Regression coverage\n\nFocused tests reproduce the 0.16.61 dangling `is likely the;` failure and the live `databaseSizeKB: "166"` unit-label mismatch, and verify future-correct/non-numeric/unrelated payloads remain unchanged.\n''')

          (root / '.github/workflows/tmp-0-16-62-patch.yml').unlink()
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "HomeBrain 0.16.62: harden performance compatibility"
          git push origin HEAD:agent/performance-metrics-compat-0-16-62
