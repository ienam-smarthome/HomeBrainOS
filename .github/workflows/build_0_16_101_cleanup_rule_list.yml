name: Build 0.16.101 cleanup rule-list fix

on:
  push:
    branches: [fix/cleanup-rule-list-0.16.101]
    paths: [.github/workflows/build_0_16_101_cleanup_rule_list.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cleanup-rule-list-0.16.101
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply 0.16.101 patch
        shell: python
        run: |
          from pathlib import Path

          cleanup = Path('hubitat-mcp-ai/rootfs/app/one_time_rule_cleanup.py')
          text = cleanup.read_text()
          text = text.replace('from automation_status_service import AutomationStatusService\n', '')
          marker = '''    async def run(self) -> OneTimeRuleCleanupResult:\n'''
          helper = '''    @staticmethod\n    def _authoritative_rule_rows(data: Any) -> list[dict[str, Any]] | None:\n        \"\"\"Return only an explicit hub_list_rules ``rules`` collection.\n\n        Destructive cleanup must distinguish a genuinely empty authoritative\n        rule list from an unrelated/schemaless gateway response. Only the\n        ``rules`` field is accepted; common MCP wrapper objects may contain it.\n        \"\"\"\n        if not isinstance(data, dict):\n            return None\n        if \"rules\" in data:\n            rows = data.get(\"rules\")\n            if not isinstance(rows, list):\n                return None\n            return [dict(row) for row in rows if isinstance(row, dict)]\n        for key in (\"result\", \"data\", \"output\", \"structuredContent\"):\n            child = data.get(key)\n            rows = OneTimeRuleCleanupService._authoritative_rule_rows(child)\n            if rows is not None:\n                return rows\n        return None\n\n'''
          if helper not in text:
              assert marker in text
              text = text.replace(marker, helper + marker)
          text = text.replace(
              'listed = await self.mcp.call_tool("hub_read_rules", {})',
              'listed = await self.mcp.call_tool(\n                "hub_read_rules",\n                {"tool": "hub_list_rules", "args": {}},\n            )',
          )
          old = '''        rules = AutomationStatusService._items_from_result(\n            listed,\n            item_type=\"rule\",\n            source=\"hub_read_rules\",\n        )\n        outcome.scanned = len(rules)\n\n        candidates = [\n            item\n            for item in rules\n            if self._candidate(\n                str(item.get(\"name\") or \"\"),\n                str(item.get(\"id\")) if item.get(\"id\") is not None else None,\n                now,\n                self.grace_minutes,\n            )\n        ]\n'''
          new = '''        rows = self._authoritative_rule_rows(listed.data)\n        if rows is None:\n            outcome.list_error = (\n                \"hub_list_rules returned no authoritative rules list; \"\n                \"no rules were deleted\"\n            )\n            logger.warning(\n                \"One-time cleanup rule-list response was not authoritative; refusing deletion\"\n            )\n            return outcome\n\n        outcome.scanned = len(rows)\n        candidates: list[dict[str, str]] = []\n        for row in rows:\n            identifier = row.get(\"appId\") or row.get(\"id\") or row.get(\"ruleId\")\n            name = str(\n                row.get(\"label\")\n                or row.get(\"name\")\n                or row.get(\"displayName\")\n                or row.get(\"title\")\n                or \"\"\n            ).strip()\n            app_id = str(identifier) if identifier is not None else None\n            if self._candidate(name, app_id, now, self.grace_minutes):\n                candidates.append({\"id\": str(app_id), \"name\": name})\n'''
          assert old in text, 'cleanup parser block not found'
          text = text.replace(old, new)
          cleanup.write_text(text)

          tests = Path('hubitat-mcp-ai/tests/test_one_time_rule_cleanup.py')
          t = tests.read_text()
          t = t.replace(
              'class FakeMCP:\n    def __init__(self, *, fail_app: str | None = None, list_failure: bool = False) -> None:\n',
              'class FakeMCP:\n    def __init__(self, *, fail_app: str | None = None, list_failure: bool = False, malformed_list: bool = False) -> None:\n',
          )
          t = t.replace(
              '        self.list_failure = list_failure\n',
              '        self.list_failure = list_failure\n        self.malformed_list = malformed_list\n',
          )
          t = t.replace(
              '        if name == "hub_read_rules":\n            if self.list_failure:\n',
              '        if name == "hub_read_rules":\n            assert arguments == {"tool": "hub_list_rules", "args": {}}\n            if self.list_failure:\n',
          )
          t = t.replace(
              '                return result(name, arguments, {"success": False, "error": "unavailable"}, error=True)\n            return result(\n',
              '                return result(name, arguments, {"success": False, "error": "unavailable"}, error=True)\n            if self.malformed_list:\n                return result(name, arguments, {"success": True, "count": 39})\n            return result(\n',
          )
          insert = '''\n\n@pytest.mark.asyncio\nasync def test_cleanup_fails_closed_when_gateway_omits_authoritative_rules_list() -> None:\n    mcp = FakeMCP(malformed_list=True)\n    service = OneTimeRuleCleanupService(mcp, local_now=local_now, grace_minutes=10)\n\n    outcome = await service.run()\n\n    assert outcome.scanned == 0\n    assert outcome.list_error == (\n        \"hub_list_rules returned no authoritative rules list; no rules were deleted\"\n    )\n    assert not outcome.deleted\n    assert [name for name, _args in mcp.calls] == [\"hub_read_rules\"]\n\n\n@pytest.mark.asyncio\nasync def test_cleanup_accepts_explicit_empty_authoritative_rules_list() -> None:\n    class EmptyRulesMCP(FakeMCP):\n        async def call_tool(self, name: str, arguments: dict[str, Any]) -> MCPToolResult:\n            self.calls.append((name, arguments))\n            assert name == \"hub_read_rules\"\n            assert arguments == {\"tool\": \"hub_list_rules\", \"args\": {}}\n            return result(name, arguments, {\"success\": True, \"rules\": []})\n\n    mcp = EmptyRulesMCP()\n    service = OneTimeRuleCleanupService(mcp, local_now=local_now, grace_minutes=10)\n    outcome = await service.run()\n\n    assert outcome.scanned == 0\n    assert outcome.list_error is None\n    assert not outcome.deleted\n'''
          anchor = '\n\n@pytest.mark.asyncio\nasync def test_scheduler_status_and_manual_run_are_observable() -> None:\n'
          assert anchor in t
          t = t.replace(anchor, insert + anchor)
          tests.write_text(t)

          config = Path('hubitat-mcp-ai/config.yaml')
          c = config.read_text().replace('version: "0.16.100"', 'version: "0.16.101"', 1)
          config.write_text(c)

          root = Path('README.md')
          r = root.read_text().replace('| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.100 |', '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.101 |', 1)
          root.write_text(r)

          readme = Path('hubitat-mcp-ai/README.md')
          r = readme.read_text().replace('Current add-on version: **0.16.100**.', 'Current add-on version: **0.16.101**.', 1)
          architecture = '## Architecture\n\n'
          paragraph = ('0.16.101 fixes one-time cleanup rule discovery on live MCP servers. Cleanup now calls the Rule Machine gateway explicitly as `hub_read_rules -> hub_list_rules`, requires an authoritative `rules` collection before considering any deletion, and extracts only rule identity/name fields for the strict `(One-time YYYY-MM-DD HH:MM)` eligibility check. Missing or malformed list structure fails closed instead of being reported as a successful zero-rule scan.\n\n')
          assert architecture in r
          r = r.replace(architecture, architecture + paragraph, 1)
          readme.write_text(r)

          index = Path('hubitat-mcp-ai/CHANGELOG-INDEX.md')
          i = index.read_text()
          i = i.replace('- [0.16.100](CHANGELOG-0.16.100.md)', '- [0.16.101](CHANGELOG-0.16.101.md)\n\n- [0.16.100](CHANGELOG-0.16.100.md)', 1)
          index.write_text(i)

          Path('hubitat-mcp-ai/CHANGELOG-0.16.101.md').write_text('''# Hubitat MCP AI 0.16.101\n\n## One-time cleanup rule discovery\n\n- Fixes the live cleanup path that reported `Checked 0 rules` despite Rule Machine containing rules.\n- Cleanup now invokes the gateway explicitly as `hub_read_rules` with `hub_list_rules`.\n- Destructive cleanup requires an explicit authoritative `rules` collection before scanning or deleting anything.\n- Missing/malformed list structure now fails closed with a visible list error instead of masquerading as a successful empty scan.\n- An explicit empty `rules: []` result remains a valid zero-rule scan.\n- Candidate extraction uses only returned rule IDs/names; existing exact one-time naming, grace-period, soft-delete, and future-rule protections remain unchanged.\n''')
      - name: Compile runtime
        run: python -m compileall -q hubitat-mcp-ai/rootfs/app
      - name: Focused cleanup tests
        run: python -m pytest -q hubitat-mcp-ai/tests/test_one_time_rule_cleanup.py
      - name: Full blocking release gate
        run: python scripts/run_release_gate.py
      - name: Commit final branch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/build_0_16_101_cleanup_rule_list.yml
          git add README.md hubitat-mcp-ai
          git commit -m "HomeBrain 0.16.101: fix cleanup rule discovery"
          git push origin HEAD:fix/cleanup-rule-list-0.16.101
