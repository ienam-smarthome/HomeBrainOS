name: Align release 0.16.60

on:
  push:
    branches:
      - agent/performance-synthesis-0-16-60

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-synthesis-0-16-60
      - name: Align release metadata
        run: python scripts/align_release_01660.py
      - name: Commit alignment and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-release-0-16-60.yml scripts/align_release_01660.py
          git add README.md hubitat-mcp-ai/config.yaml hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md hubitat-mcp-ai/CHANGELOG-0.16.60.md
          git commit -m 'Align HomeBrain 0.16.60 release metadata'
          git push origin HEAD:agent/performance-synthesis-0-16-60
