name: Align release 0.16.60

on:
  push:
    branches:
      - agent/performance-synthesis-0-16-60

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-synthesis-0-16-60
      - name: Align release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('hubitat-mcp-ai/config.yaml'): [('version: "0.16.59"', 'version: "0.16.60"')],
              Path('README.md'): [('| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.59 |', '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.60 |')],
              Path('hubitat-mcp-ai/README.md'): [('Current add-on version: **0.16.59**.', 'Current add-on version: **0.16.60**.')],
              Path('hubitat-mcp-ai/CHANGELOG-INDEX.md'): [('## Current release\n\n- [0.16.59]', '## Current release\n\n- [0.16.60](CHANGELOG-0.16.60.md)\n- [0.16.59]')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  assert old in text, (path, old)
                  text = text.replace(old, new, 1)
              path.write_text(text)

          Path('hubitat-mcp-ai/CHANGELOG-0.16.60.md').write_text('''# Hubitat MCP AI 0.16.60

## Performance synthesis grounding

- Recommendation and action tables are now grounded by their header-defined `Action`/`Recommendation` column rather than assuming the actionable content is always the second column.
- Conditional and gerund tuning language such as increasing polling intervals, switching to push models, disabling auto-refresh/status polling, and related polling/reporting edits is inspection-first unless the relevant configuration has been read.
- Unsupported performance impact claims such as blocking other automations, micro-stutters, primary sources of inefficiency, or activity contributing to a measured busy rate are localized while retaining the measured values.
- Measured busy percentages remain visible when an unsupported causal link is removed.
- Mechanism localization removes a dangling `which` before safe replacement text, avoiding malformed output such as `which;`.
- Existing 0.16.54-0.16.59 configuration, mechanism, causality, and log-grounding safeguards remain intact.
- No additional Hubitat calls are introduced.

## Live regression coverage

The regression suite reproduces the two 0.16.59 performance outputs, including four-column summary tables, LG blocking/polling wording, scheduler polling recommendations, and measured busy-rate causality. The full release suite contains 1,478 tests.
''')
          PY
      - name: Commit alignment and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-release-0-16-60.yml
          git add README.md hubitat-mcp-ai/config.yaml hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md hubitat-mcp-ai/CHANGELOG-0.16.60.md
          git commit -m 'Align HomeBrain 0.16.60 release metadata'
          git push origin HEAD:agent/performance-synthesis-0-16-60
