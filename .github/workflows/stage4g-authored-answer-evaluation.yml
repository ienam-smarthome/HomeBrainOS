name: Stage 4G real model-authored investigation answers (synthetic)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4g-authored-answer-evaluation.yml'
      - 'hubitat-mcp-ai/tools/stage4g_github_authored_answers.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_full_answer_evaluation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4g-authored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authored-offline-only:
    name: Qwen 3B authored explanation + two diagnostic reviewers
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_CONTEXT_LENGTH: '3072'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify only synthetic no-cloud evaluation is configured
        run: |
          set -euo pipefail
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          test "$OLLAMA_NO_CLOUD" = "1"
          python -m compileall -q hubitat-mcp-ai/tools/stage4g_github_authored_answers.py
          python -m compileall -q hubitat-mcp-ai/rootfs/app/stage4_full_answer_evaluation.py
      - name: Install Ollama locally
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/stage4g-ollama-installer.sh
          sh /tmp/stage4g-ollama-installer.sh
          ollama --version
      - name: Start local no-cloud model inference
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4g-ollama.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Local offline Ollama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed readiness"
          exit 1
      - name: Download two resident public 3B models
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama pull llama3.2:3b
          ollama list | grep -F 'qwen2.5:3b'
          ollama list | grep -F 'llama3.2:3b'
      - name: Generate real model-written investigation explanations and measure source coverage
        timeout-minutes: 45
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4g_github_authored_answers.py \
            --ack-github-synthetic-local-inference --timeout-seconds 120
      - name: Confirm production publisher and smart home unaffected
        if: always()
        run: |
          echo "Only constructed evidence; no private input or household access."
          echo "No model answer was published; no Hubitat/HA commands were invoked."
