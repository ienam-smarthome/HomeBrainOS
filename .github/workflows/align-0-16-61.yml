name: Align HomeBrain 0.16.61 release

on:
  push:
    branches:
      - agent/evidence-repair-cleanup-0-16-61

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-repair-cleanup-0-16-61
          fetch-depth: 0
      - name: Align release metadata
        run: python .github/scripts/align_0_16_61.py
      - name: Commit alignment and remove helpers
        run: |
          rm -f .github/scripts/align_0_16_61.py .github/workflows/align-0-16-61.yml tests/.trigger_0_16_61
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align HomeBrain 0.16.61 release metadata"
          git push origin HEAD:agent/evidence-repair-cleanup-0-16-61
