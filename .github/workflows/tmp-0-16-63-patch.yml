name: Temporary 0.16.63 patch

on:
  push:
    branches:
      - agent/performance-diagnostic-breadth-0-16-63

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-diagnostic-breadth-0-16-63
          fetch-depth: 0
      - name: Apply 0.16.63 patch
        run: python .github/tmp-0-16-63-patch.py
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-0-16-63-patch.yml .github/workflows/tmp-0-16-63-fix-runner.yml .github/tmp-0-16-63-patch.py
          git add -A
          git diff --cached --check
          git commit -m "HomeBrain 0.16.63: broaden grounded performance diagnostics"
          git push origin HEAD:agent/performance-diagnostic-breadth-0-16-63
