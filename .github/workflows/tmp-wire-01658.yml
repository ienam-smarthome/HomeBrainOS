name: Temporary wire 0.16.58 semantic grounding
on:
  push:
    paths:
      - .github/workflows/tmp-wire-01658.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-semantic-grounding-0-16-58
      - name: Patch performance guard
        shell: python
        run: |
          from pathlib import Path
          path = Path('hubitat-mcp-ai/rootfs/app/performance_causality_guard.py')
          text = path.read_text()
          import_anchor = 'from typing import Any\n'
          import_line = 'from performance_semantic_grounding import ground_performance_semantics\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          start = text.index('    if not has_configuration:\n')
          end = text.index('    corrected = _ensure_grounded_next_actions(corrected)\n', start)
          text = text[:start] + '    if not has_configuration:\n        corrected = ground_performance_semantics(corrected)\n\n' + text[end:]
          path.write_text(text)
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-wire-01658.yml
          git add hubitat-mcp-ai/rootfs/app/performance_causality_guard.py
          git config user.name "ienam-smarthome"
          git config user.email "ienam.smarthome@gmail.com"
          git commit -m "Wire structural performance semantic grounding"
          git push origin HEAD:agent/performance-semantic-grounding-0-16-58
