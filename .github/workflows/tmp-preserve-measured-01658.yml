name: Temporary preserve 0.16.58 measured prefixes
on:
  push:
    paths:
      - .github/workflows/tmp-preserve-measured-01658.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-semantic-grounding-0-16-58
      - name: Preserve measured prefix when localizing mechanism clause
        shell: python
        run: |
          from pathlib import Path
          path = Path('hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py')
          text = path.read_text()
          old = '''    if not _ASSERTIVE_MECHANISM_LINK.search(comparable):\n        return sentence\n    return (\n        "This is an implementation hypothesis worth investigating; the current performance statistics "\n        "do not establish whether timeouts, API latency, polling/config pushes, retries, reconnects, "\n        "reporting cadence, or another implementation mechanism is responsible."\n    )\n'''
          new = '''    link = _ASSERTIVE_MECHANISM_LINK.search(comparable)\n    if not link:\n        return sentence\n\n    raw_link = _ASSERTIVE_MECHANISM_LINK.search(sentence)\n    if raw_link and raw_link.start() > 0:\n        prefix = sentence[: raw_link.start()].rstrip(" ,;:-")\n        if re.search(\n            r"(?i)(?:\\d[\\d,.]*(?:-\\d[\\d,.]*)?\\s*(?:%|ms|s|sec(?:ond)?s?|mb)|"\n            r"\\b(?:busy|calls?|call count|execution time|latency|free memory)\\b)",\n            re.sub(r"[*_`]", "", prefix),\n        ):\n            return (\n                prefix\n                + "; the implementation cause of that measured result is not established by the current "\n                + "performance statistics."\n            )\n\n    return (\n        "This is an implementation hypothesis worth investigating; the current performance statistics "\n        "do not establish whether timeouts, API latency, polling/config pushes, retries, reconnects, "\n        "reporting cadence, or another implementation mechanism is responsible."\n    )\n'''
          if old not in text:
              raise SystemExit('mechanism localization anchor not found')
          path.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-preserve-measured-01658.yml
          git add hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py
          git config user.name "ienam-smarthome"
          git config user.email "ienam.smarthome@gmail.com"
          git commit -m "Preserve measured prefixes during mechanism localization"
          git push origin HEAD:agent/performance-semantic-grounding-0-16-58
