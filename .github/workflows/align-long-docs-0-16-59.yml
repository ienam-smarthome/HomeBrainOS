name: Align long docs 0.16.59

on:
  push:
    branches:
      - agent/log-grounding-and-synthesis-0-16-59

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/log-grounding-and-synthesis-0-16-59
      - name: Update long documentation version references
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('hubitat-mcp-ai/README.md'); s=p.read_text(); old='Current add-on version: **0.16.58**.'; assert old in s; p.write_text(s.replace(old, 'Current add-on version: **0.16.59**.', 1))"
          python -c "from pathlib import Path; p=Path('hubitat-mcp-ai/CHANGELOG-INDEX.md'); s=p.read_text(); old='## Current release\\n\\n- [0.16.58](CHANGELOG-0.16.58.md)'; assert old in s; p.write_text(s.replace(old, '## Current release\\n\\n- [0.16.59](CHANGELOG-0.16.59.md)\\n- [0.16.58](CHANGELOG-0.16.58.md)', 1))"
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-long-docs-0-16-59.yml
          git add hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md
          git commit -m 'Align 0.16.59 long documentation references'
          git push origin HEAD:agent/log-grounding-and-synthesis-0-16-59
