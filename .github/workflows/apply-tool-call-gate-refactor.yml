name: Apply tool-call gate refactor

on:
  push:
    branches:
      - refactor/tool-call-driven-mutation-gate
    paths:
      - scripts/apply_tool_call_gate_refactor.py
      - .github/workflows/apply-tool-call-gate-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tool-call-driven-mutation-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refactor
        run: python scripts/apply_tool_call_gate_refactor.py
      - name: Compile changed Python
        run: python -m py_compile hubitat-mcp-ai/rootfs/app/mcp_agent_orchestrator.py hubitat-mcp-ai/rootfs/app/tool_registry.py tests/test_tool_call_driven_gate.py
      - name: Commit generated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move mutation gating to actual tool calls"
          git push origin HEAD:refactor/tool-call-driven-mutation-gate
