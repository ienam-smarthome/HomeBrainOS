name: Apply 0.16.61 grounding patch

on:
  push:
    branches:
      - agent/evidence-repair-cleanup-0-16-61

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-repair-cleanup-0-16-61
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_0_16_61.py
      - name: Commit patch and remove helpers
        run: |
          rm -f .github/scripts/apply_0_16_61.py .github/workflows/apply-0-16-61.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply HomeBrain 0.16.61 grounding cleanup"
          git push origin HEAD:agent/evidence-repair-cleanup-0-16-61
