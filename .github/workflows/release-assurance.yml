name: Release assurance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Metadata and repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate release metadata
        run: python scripts/validate_release_consistency.py
      - name: Validate add-on structure
        run: python scripts/validate_addon.py
      - name: Analyse maintained imports
        run: python scripts/analyze_imports.py
      - name: Run release assurance contracts
        run: python -m pytest -q tests/test_release_assurance.py tests/test_repository_hygiene.py

  tests:
    name: Full Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run blocking release gate
        run: python scripts/run_release_gate.py

  container-smoke:
    name: Add-on container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read configured version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' hubitat-mcp-ai/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build add-on image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/hassio-addons/base:15.0.8 \
            --build-arg BUILD_VERSION=${{ steps.version.outputs.version }} \
            --build-arg BUILD_ARCH=amd64 \
            --tag homebrain-release-smoke:${{ github.sha }} \
            hubitat-mcp-ai
      - name: Verify packaged runtime
        run: |
          docker run --rm --entrypoint /bin/sh \
            homebrain-release-smoke:${{ github.sha }} \
            -ec "python3 -m compileall -q /app; test \"\$(cat /app/.homebrain-build-version)\" = '${{ steps.version.outputs.version }}'; test -x /run.sh"
