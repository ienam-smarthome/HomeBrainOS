name: Apply issue 687 freshness semantics patch

on:
  push:
    branches:
      - fix/home-snapshot-freshness-semantics
    paths:
      - .github/workflows/patch-687.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-snapshot-freshness-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic patch and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('hubitat-mcp-ai/rootfs/app')
          health = root / 'health_audit_service.py'
          text = health.read_text(encoding='utf-8')
          text = text.replace('_SNAPSHOT_SCHEMA_VERSION = 2', '_SNAPSHOT_SCHEMA_VERSION = 3')

          marker = '_BOOL_ONLINE_KEYS = ("online", "reachable", "connected")\n_SNAPSHOT_SCHEMA_VERSION = 3'
          replacement = '''_BOOL_ONLINE_KEYS = ("online", "reachable", "connected")
_FRESHNESS_SECONDS_KEYS = (
    "expectedUpdateSeconds", "freshnessSeconds", "maxAgeSeconds",
    "reportingIntervalSeconds", "pollIntervalSeconds", "refreshIntervalSeconds",
    "heartbeatIntervalSeconds",
)
_FRESHNESS_MINUTES_KEYS = (
    "expectedUpdateMinutes", "freshnessMinutes", "maxAgeMinutes",
    "reportingIntervalMinutes", "pollIntervalMinutes", "refreshIntervalMinutes",
    "heartbeatIntervalMinutes",
)
_FRESHNESS_HOURS_KEYS = (
    "expectedUpdateHours", "freshnessHours", "maxAgeHours",
    "reportingIntervalHours", "pollIntervalHours", "refreshIntervalHours",
    "heartbeatIntervalHours",
)
_SNAPSHOT_SCHEMA_VERSION = 3'''
          if marker not in text:
              raise SystemExit('freshness constants marker not found')
          text = text.replace(marker, replacement, 1)

          false_like = '''def _false_like(value: Any) -> bool:
    if isinstance(value, bool):
        return value is False
    return str(value or "").strip().casefold() in {"false", "0", "no", "off"}
'''
          helper = false_like + '''\n\ndef _freshness_seconds(device: dict[str, Any]) -> float | None:
    """Return an explicit device freshness contract, never an inferred capability cadence."""
    values = _canonical_attributes(device)
    for keys, multiplier in (
        (_FRESHNESS_SECONDS_KEYS, 1.0),
        (_FRESHNESS_MINUTES_KEYS, 60.0),
        (_FRESHNESS_HOURS_KEYS, 3600.0),
    ):
        raw = _first(values, keys)
        value = _safe_float(raw)
        if value is not None and value > 0:
            return value * multiplier
    return None
'''
          if false_like not in text:
              raise SystemExit('false_like marker not found')
          text = text.replace(false_like, helper, 1)

          start = text.index('def _device_findings(')
          end = text.index('\n\ndef _tool_map(', start)
          new_findings = r'''def _device_findings(
    devices: list[dict[str, Any]],
    *,
    low_battery_threshold: int,
    stale_hours: int = 24,
    long_stale_hours: int = 24 * 7,
    cluster_minutes: int = 15,
    motion_active_hours: int = 2,
    previously_stale_ids: set[str] | None = None,
    now: datetime | None = None,
) -> tuple[dict[str, Any], list[dict[str, Any]]]:
    """Classify device health without promoting quiet timestamps into failure evidence.

    Direct health/unreachable signals may create an offline issue. An old activity
    timestamp by itself is neutral. Only an explicit freshness/reporting contract
    supplied by the device may create an expected-update-overdue issue.
    """
    del long_stale_hours, motion_active_hours, previously_stale_ids  # compatibility only
    checked_at = (now or _utc_now()).astimezone(timezone.utc)
    low_batteries: list[dict[str, Any]] = []
    offline: list[dict[str, Any]] = []
    no_recent_activity: list[dict[str, Any]] = []
    expected_update_overdue: list[dict[str, Any]] = []
    never_reported: list[dict[str, Any]] = []
    unconfirmed_cached_state: list[dict[str, Any]] = []
    issues: list[dict[str, Any]] = []

    active_state_rules = {
        "switch": {"on"},
        "motion": {"active"},
        "presence": {"present", "home"},
        "occupancy": {"occupied", "active", "present"},
        "contact": {"open"},
        "lock": {"unlocked"},
        "water": {"wet"},
    }

    for device in devices:
        label = _label(device)
        identifier = _device_id(device)
        values = _canonical_attributes(device)

        battery = _safe_float(_first(values, ("battery",)))
        if battery is not None and battery <= low_battery_threshold:
            row = {"id": identifier, "label": label, "battery": round(battery, 1)}
            low_batteries.append(row)
            issues.append(_issue(
                "device-battery", "warning", f"Low battery: {label}",
                f"{battery:g}% (threshold {low_battery_threshold}%).", key=identifier,
            ))

        state = _first(values, _HEALTH_STATE_KEYS)
        online_flag = _first(values, _BOOL_ONLINE_KEYS)
        state_text = str(state or "").strip().casefold()
        explicitly_offline = state_text in _OFFLINE_VALUES
        explicitly_unreachable = online_flag is not None and _false_like(online_flag)
        if explicitly_offline or explicitly_unreachable:
            reason = str(state or "not reachable").strip()
            offline.append({"id": identifier, "label": label, "state": reason})
            issues.append(_issue(
                "device-offline", "warning", f"Device unavailable: {label}",
                reason or "Device reports unavailable/offline.", key=identifier,
            ))
            continue

        has_activity_field, raw_activity, activity_at = _activity_value(device)
        profile = _device_profile(device)
        subsystem = _device_subsystem(device)
        freshness_seconds = _freshness_seconds(device)
        if has_activity_field and activity_at is None:
            never_reported.append({
                "id": identifier, "label": label, "profile": profile,
                "last_activity": raw_activity,
            })
            continue
        if activity_at is None:
            continue

        age = _age_hours(activity_at, checked_at)
        activity_row = {
            "id": identifier,
            "label": label,
            "profile": profile,
            "subsystem": subsystem,
            "last_activity": activity_at.isoformat(),
            "last_activity_at": activity_at,
            "age_hours": round(age, 2),
        }
        if freshness_seconds is not None:
            activity_row["freshness_contract_seconds"] = round(freshness_seconds, 3)
            if age * 3600 > freshness_seconds:
                overdue = dict(activity_row)
                overdue["overdue_by_seconds"] = round(age * 3600 - freshness_seconds, 3)
                expected_update_overdue.append(overdue)
                issues.append(_issue(
                    "device-update-overdue",
                    "warning",
                    f"Expected update overdue: {label}",
                    f"Explicit freshness contract is {_format_age(freshness_seconds / 3600)}; "
                    f"last activity was {_format_age(age)} ago. The missed expectation does not establish the cause.",
                    key=identifier,
                ))

        if age < stale_hours:
            continue

        no_recent_activity.append(dict(activity_row))
        cached: dict[str, str] = {}
        for key, active_values in active_state_rules.items():
            value = _first(values, (key,))
            rendered = str(value or "").strip().casefold()
            if rendered in active_values:
                cached[key] = str(value)
        if cached:
            unconfirmed_cached_state.append({
                **dict(activity_row),
                "cached_state": cached,
                "live_status_confirmed": False,
            })

    clusters = _stale_clusters(no_recent_activity, cluster_minutes=cluster_minutes)
    activity_clusters: list[dict[str, Any]] = []
    for cluster in clusters:
        members = list(cluster["members"])
        identifiers = sorted(str(item["id"]) for item in members)
        labels = sorted(str(item["label"]) for item in members)
        first = min(item["last_activity_at"] for item in members)
        last = max(item["last_activity_at"] for item in members)
        activity_clusters.append({
            "subsystem": str(cluster["subsystem"]),
            "count": len(members),
            "device_ids": identifiers,
            "devices": labels,
            "first_activity_timestamp": first.isoformat(),
            "last_activity_timestamp": last.isoformat(),
            "interpretation": "timestamp_cluster_only",
            "common_failure_proven": False,
        })

    low_batteries.sort(key=lambda row: (row["battery"], row["label"].casefold()))
    offline.sort(key=lambda row: row["label"].casefold())
    for rows in (no_recent_activity, expected_update_overdue, never_reported, unconfirmed_cached_state):
        rows.sort(key=lambda row: str(row["label"]).casefold())
        for row in rows:
            row.pop("last_activity_at", None)
    activity_clusters.sort(key=lambda row: (row["subsystem"], row["first_activity_timestamp"]))

    # Keep legacy fields present but neutral so existing consumers do not break
    # while no longer treating age-only observations as health failures.
    return {
        "total": len(devices),
        "low_battery_count": len(low_batteries),
        "offline_count": len(offline),
        "no_recent_activity_count": len(no_recent_activity),
        "expected_update_overdue_count": len(expected_update_overdue),
        "activity_cluster_count": len(activity_clusters),
        "unconfirmed_cached_state_count": len(unconfirmed_cached_state),
        "never_reported_count": len(never_reported),
        "low_batteries": low_batteries,
        "offline": offline,
        "no_recent_activity": no_recent_activity,
        "expected_update_overdue": expected_update_overdue,
        "activity_clusters": activity_clusters,
        "unconfirmed_cached_state": unconfirmed_cached_state,
        "never_reported": never_reported,
        "suspicious_stale_count": 0,
        "stale_candidate_count": 0,
        "long_term_stale_count": 0,
        "passive_quiet_count": len(no_recent_activity),
        "motion_active_too_long_count": 0,
        "occupied_long_count": 0,
        "stale_cluster_count": 0,
        "suspicious_stale": [],
        "stale_candidates": [],
        "long_term_stale": [],
        "passive_quiet": no_recent_activity,
        "motion_active_too_long": [],
        "occupied_long": [],
        "stale_clusters": [],
    }, issues
'''
          text = text[:start] + new_findings + text[end:]
          health.write_text(text, encoding='utf-8')

          prompt = root / 'agent_prompt_policy.py'
          p = prompt.read_text(encoding='utf-8')
          anchor = '''        "- A low battery is a numeric battery level at or below 20 percent. "\n        "Exclude every device above 20 percent.\\n"\n'''
          freshness_policy = anchor + '''        "- DEVICE FRESHNESS SEMANTICS: An old lastActivity, lastEvent, lastSeen, "\n        "or similar timestamp by itself proves only that no recent activity was observed. "\n        "It does NOT prove that a device is offline, dead, failed, disconnected, or stopped "\n        "reporting. Device capabilities such as TemperatureMeasurement or PowerMeter do NOT "\n        "establish a reporting cadence. Use 'offline' or 'unavailable' only when current-turn "\n        "health/communication evidence says so. Use 'expected update overdue' only when current-turn "\n        "evidence includes an explicit reporting/freshness expectation and that expectation is missed. "\n        "If a cached state such as switch=on is supported only by an old timestamp, say the live "\n        "status cannot be confirmed. A cluster of similar last-event timestamps is an observation "\n        "or investigation hypothesis only; do not infer a shared integration, cloud, network, or "\n        "device failure unless separate current-turn evidence links the devices to that mechanism.\\n"\n'''
          if anchor not in p:
              raise SystemExit('prompt low-battery anchor not found')
          p = p.replace(anchor, freshness_policy, 1)
          prompt.write_text(p, encoding='utf-8')

          tests = Path('hubitat-mcp-ai/tests/test_health_audit_freshness_semantics.py')
          tests.write_text(r'''from __future__ import annotations

import sys
from datetime import datetime, timezone
from pathlib import Path

APP_DIR = Path(__file__).resolve().parents[1] / "rootfs" / "app"
sys.path.insert(0, str(APP_DIR))

from agent_prompt_policy import build_system_prompt
from health_audit_service import _device_findings

NOW = datetime(2026, 10, 2, 20, 0, tzinfo=timezone.utc)
OLD = "2026-09-30T20:00:00+00:00"


def _find(devices):
    return _device_findings(devices, low_battery_threshold=20, now=NOW)


def test_age_only_temperature_device_is_neutral_not_stale_or_offline():
    section, issues = _find([{
        "id": "1", "label": "Quiet temperature sensor",
        "capabilities": ["TemperatureMeasurement"],
        "attributes": {"temperature": 21.2, "lastActivity": OLD},
    }])
    assert section["no_recent_activity_count"] == 1
    assert section["expected_update_overdue_count"] == 0
    assert section["offline_count"] == 0
    assert not [i for i in issues if i["category"] in {"device-stale", "device-long-stale", "device-offline"}]


def test_virtual_flag_contact_and_remote_are_quiet_not_failed():
    devices = [
        {"id": "v", "label": "Backup Hub Active", "attributes": {"switch": "off", "lastActivity": OLD}},
        {"id": "c", "label": "Front Door Contact", "capabilities": ["ContactSensor"], "attributes": {"contact": "closed", "lastActivity": OLD}},
        {"id": "r", "label": "Ikea remote", "capabilities": ["PushableButton"], "attributes": {"lastActivity": OLD}},
    ]
    section, issues = _find(devices)
    assert section["no_recent_activity_count"] == 3
    assert section["offline_count"] == 0
    assert not [i for i in issues if i["category"].startswith("device-stale")]


def test_direct_offline_evidence_remains_actionable():
    section, issues = _find([{
        "id": "2", "label": "Offline plug",
        "attributes": {"healthStatus": "offline", "lastActivity": OLD},
    }])
    assert section["offline_count"] == 1
    assert any(i["category"] == "device-offline" for i in issues)


def test_explicit_freshness_contract_can_be_overdue():
    section, issues = _find([{
        "id": "3", "label": "Contract sensor",
        "attributes": {"temperature": 20.0, "lastActivity": OLD, "expectedUpdateSeconds": 3600},
    }])
    assert section["expected_update_overdue_count"] == 1
    assert any(i["category"] == "device-update-overdue" for i in issues)


def test_old_cached_on_state_is_unconfirmed_not_live_truth():
    section, issues = _find([{
        "id": "4", "label": "Old TV", "attributes": {"switch": "on", "lastActivity": OLD},
    }])
    assert section["unconfirmed_cached_state_count"] == 1
    assert section["unconfirmed_cached_state"][0]["live_status_confirmed"] is False
    assert not [i for i in issues if i["category"] == "device-offline"]


def test_timestamp_cluster_is_observation_not_interruption_issue():
    devices = [
        {"id": str(i), "label": f"MQTT {i}", "driverName": "MQTT", "attributes": {"power": i, "lastActivity": f"2026-09-30T20:0{i}:00+00:00"}}
        for i in range(3)
    ]
    section, issues = _find(devices)
    assert section["activity_cluster_count"] == 1
    assert section["activity_clusters"][0]["common_failure_proven"] is False
    assert not [i for i in issues if i["category"] == "device-stale-cluster"]


def test_prompt_forbids_promoting_old_activity_into_failure():
    prompt = build_system_prompt(
        "Device manifest omitted or unavailable.", now=NOW,
    )
    assert "DEVICE FRESHNESS SEMANTICS" in prompt
    assert "proves only that no recent activity was observed" in prompt
    assert "capabilities such as TemperatureMeasurement or PowerMeter do NOT establish a reporting cadence" in prompt
    assert "live status cannot be confirmed" in prompt
    assert "do not infer a shared integration" in prompt
''', encoding='utf-8')

          workflow = Path('.github/workflows/patch-687.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          python -m compileall -q hubitat-mcp-ai/rootfs/app
          python -m pytest -q hubitat-mcp-ai/tests/test_agent_prompt_policy.py hubitat-mcp-ai/tests/test_health_audit_freshness_semantics.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: evidence-bound device freshness semantics (#687)"
          git push origin HEAD:fix/home-snapshot-freshness-semantics
