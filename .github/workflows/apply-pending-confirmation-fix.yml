name: Apply pending confirmation mutation fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tool-call-driven-mutation-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python scripts/apply_pending_confirmation_mutation_fix.py
      - name: Compile
        run: python -m py_compile hubitat-mcp-ai/rootfs/app/mcp_agent_orchestrator.py tests/test_tool_call_driven_gate.py
      - name: Commit generated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve mutation metadata after confirmation"
          git push origin HEAD:refactor/tool-call-driven-mutation-gate
