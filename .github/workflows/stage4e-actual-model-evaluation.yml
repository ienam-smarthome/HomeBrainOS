name: Stage 4E actual small-model evaluation (synthetic only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4e-actual-model-evaluation.yml'
      - 'hubitat-mcp-ai/tools/stage4e_github_actual_models.py'
      - 'hubitat-mcp-ai/tools/stage4c_local_model_eval.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_offline_model_evaluation.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_semantic_sufficiency.py'
      - 'hubitat-mcp-ai/rootfs/app/stage4_narrative_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4e-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-local-llm:
    name: Actual CPU-only model reviews (no real devices)
    # Never execute an external fork's modified code or PR-supplied secrets.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '2'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic-only source code and permissions
        run: |
          test "$OLLAMA_NO_CLOUD" = "1"
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          test -f hubitat-mcp-ai/tools/stage4e_github_actual_models.py
          test -f hubitat-mcp-ai/tools/stage4c_local_model_eval.py
          python -m compileall -q hubitat-mcp-ai/tools/stage4e_github_actual_models.py
          python -m compileall -q hubitat-mcp-ai/rootfs/app/stage4_offline_model_evaluation.py
      - name: Install official Ollama on isolated runner
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/ollama-stage4e-install.sh
          sh /tmp/ollama-stage4e-install.sh
          ollama --version
      - name: Start loopback-only Ollama with cloud features disabled
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4e-ollama-server.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Local Ollama started with cloud disabled"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama loopback readiness failed"
          exit 1
      - name: Download two small LOCAL model weights (public synthetic data only)
        run: |
          set -euo pipefail
          ollama pull qwen2.5:0.5b
          ollama pull llama3.2:1b
          ollama list
          # Both exact tags must be locally installed before any inference.
          ollama list | grep -F 'qwen2.5:0.5b'
          ollama list | grep -F 'llama3.2:1b'
      - name: Run actual two-model evidence entailment evaluation
        timeout-minutes: 27
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4e_github_actual_models.py \
            --ack-github-synthetic-local-inference --timeout-seconds 90
      - name: Explicitly report source-only privacy and publisher safety
        if: always()
        run: |
          echo "Stage 4E: no Hubitat/HA credentials or user files were provided."
          echo "All model test facts are constructed. No HomeBrain publisher integration."
