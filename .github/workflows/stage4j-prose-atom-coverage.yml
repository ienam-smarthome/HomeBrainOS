name: Stage 4J real prose-to-atom extraction (synthetic only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage4j-prose-atom-coverage.yml'
      - 'hubitat-mcp-ai/rootfs/app/stage4_prose_atom_coverage.py'
      - 'hubitat-mcp-ai/tools/stage4j_github_prose_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4j-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-prose-extractor:
    name: Qwen2.5 3B extracts implicit evidence claims (offline)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '3072'
      OLLAMA_DEBUG: '0'
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated synthetic source
        run: |
          set -euo pipefail
          test "$OLLAMA_HOST" = "127.0.0.1:11434"
          test "$OLLAMA_NO_CLOUD" = "1"
          python -m compileall -q hubitat-mcp-ai/tools/stage4j_github_prose_coverage.py
          python -m compileall -q hubitat-mcp-ai/rootfs/app/stage4_prose_atom_coverage.py
      - name: Install official Ollama locally
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ollama.com/install.sh -o /tmp/stage4j-ollama-install.sh
          sh /tmp/stage4j-ollama-install.sh
          ollama --version
      - name: Start localhost Ollama without cloud inference
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/stage4j-ollama.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS --noproxy '*' --max-time 3 http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Local no-cloud Ollama ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama not ready"
          exit 1
      - name: Pull locally resident public Qwen 3B weights
        run: |
          set -euo pipefail
          ollama pull qwen2.5:3b
          ollama list | grep -F 'qwen2.5:3b'
      - name: Extract all claims and independently measure missed implications
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python hubitat-mcp-ai/tools/stage4j_github_prose_coverage.py \
            --ack-github-synthetic-local-inference --timeout-seconds 120
      - name: Report invariant production boundary
        if: always()
        run: |
          echo "Only synthetic prose and host-owned artificial evidence."
          echo "No Hubitat, HA, secrets, home devices, private user data or publisher integration."
