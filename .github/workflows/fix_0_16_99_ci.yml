name: Fix 0.16.99 CI contracts
on:
  push:
    branches:
      - fix/immediate-internet-unblock-0.16.99
    paths:
      - .github/workflows/fix_0_16_99_ci.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/immediate-internet-unblock-0.16.99
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CI contract cleanup
        run: python .github/scripts/fix_0_16_99_ci.py
      - name: Compile parser and runtime
        run: python -m py_compile hubitat-mcp-ai/rootfs/app/request_classification.py hubitat-mcp-ai/rootfs/app/homebrain_agent.py
      - name: Run focused parser and Internet-control regressions
        run: |
          python -m pip install -q -r requirements-test.txt
          pytest -q tests/test_internet_access_hardening.py tests/test_homebrain_agent.py -k 'internet_access or unblock or immediate_block_request or immediate_allow_request or scheduled_block_request or no_capable_device'
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'HomeBrain 0.16.99: align unblock safety contracts'
          git push
