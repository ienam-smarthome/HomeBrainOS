name: Temporary 0.16.57 README alignment

on:
  push:
    branches:
      - agent/performance-synthesis-quality-0-16-57

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-synthesis-quality-0-16-57
      - name: Align README and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('hubitat-mcp-ai/README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Current add-on version: **0.16.56**.'
          new = 'Current add-on version: **0.16.57**.'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one current-version line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temp-align-01657-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hubitat-mcp-ai/README.md .github/workflows/temp-align-01657-readme.yml
          git commit -m 'Align add-on README to 0.16.57'
          git push origin HEAD:agent/performance-synthesis-quality-0-16-57
