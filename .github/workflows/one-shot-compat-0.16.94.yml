name: One-shot 0.16.94 compatibility patch
on:
  push:
    branches: [fix/internet-switch-scheduling-0.16.94]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internet-switch-scheduling-0.16.94
          fetch-depth: 0
      - name: Preserve identity interface compatibility
        shell: python
        run: |
          from pathlib import Path
          path = Path('hubitat-mcp-ai/rootfs/app/rule_authoring_service.py')
          text = path.read_text()
          old = '''            identity_started = time.monotonic()\n            try:\n                identities = list(await self.mcp.get_device_identities() or [])\n            except Exception as exc:\n'''
          new = '''            identity_started = time.monotonic()\n            try:\n                # get_cached_devices() is the long-established enriched identity\n                # interface used by the control/query paths and by older MCP\n                # clients/test doubles. Prefer it here; fall back to the newer\n                # get_device_identities() helper when only that interface exists.\n                identity_reader = getattr(self.mcp, "get_cached_devices", None)\n                if not callable(identity_reader):\n                    identity_reader = getattr(self.mcp, "get_device_identities", None)\n                if not callable(identity_reader):\n                    raise AttributeError("No device identity reader is available")\n                identities = list(await identity_reader() or [])\n            except Exception as exc:\n'''
          if old not in text:
              raise SystemExit('identity reader anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-compat-0.16.94.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubitat-mcp-ai/rootfs/app/rule_authoring_service.py .github/workflows/one-shot-compat-0.16.94.yml
          git commit -m "Preserve Internet schedule identity compatibility"
          git push origin HEAD:fix/internet-switch-scheduling-0.16.94
