name: Temporary patch 0.16.58 analysis clauses
on:
  push:
    paths:
      - .github/workflows/tmp-analysis-clause-01658.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-semantic-grounding-0-16-58
      - name: Ground unsafe analysis clauses without erasing measured facts
        shell: python
        run: |
          from pathlib import Path
          path = Path('hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py')
          text = path.read_text()
          old = '''        localized = _localize_mechanism_sentence(sentence)\n        localized = _localize_outcome_sentence(localized)\n        pieces[index] = localized\n'''
          new = '''        localized = _localize_mechanism_sentence(sentence)\n        localized = _localize_outcome_sentence(localized)\n        if _unsafe_recommendation(localized):\n            localized = _configuration_guidance(localized)\n        pieces[index] = localized\n'''
          if old not in text:
              raise SystemExit('analysis localization anchor not found')
          path.write_text(text.replace(old, new, 1))
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-analysis-clause-01658.yml
          git add hubitat-mcp-ai/rootfs/app/performance_semantic_grounding.py
          git config user.name "ienam-smarthome"
          git config user.email "ienam.smarthome@gmail.com"
          git commit -m "Localize unsafe analysis clauses without erasing metrics"
          git push origin HEAD:agent/performance-semantic-grounding-0-16-58
