name: One-shot 0.16.92 release packaging

on:
  push:
    branches:
      - fix/internet-relative-routing-0.16.92

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internet-relative-routing-0.16.92
          fetch-depth: 0
      - name: Align 0.16.92 release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('hubitat-mcp-ai/config.yaml', 'version: "0.16.91"', 'version: "0.16.92"')
          replace_once(
              'README.md',
              '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.91 |',
              '| [Hubitat MCP AI](hubitat-mcp-ai/README.md) | 0.16.92 |',
          )
          replace_once(
              'hubitat-mcp-ai/README.md',
              'Current add-on version: **0.16.91**.',
              'Current add-on version: **0.16.92**.',
          )
          addon = Path('hubitat-mcp-ai/README.md')
          text = addon.read_text()
          marker = '## Architecture\n\n'
          paragraph = (
              '0.16.92 closes the remaining scheduled-Internet routing gap exposed by the 0.16.91 live proof. '
              'The immediate Internet-access parser now uses the same future/recurring timing guard as ordinary '
              'device control, so `after 1 min`, `in 30 mins`, `2 hours later`, absolute clock schedules, and recurring '
              'requests cannot be swallowed into the Internet device name. Those requests remain available to the '
              'deterministic `RuleAuthoringService`, while a bare immediate `block X` / `allow X` request retains the '
              'existing fast path. No Hubitat command semantics are inverted.\n\n'
          )
          if paragraph not in text:
              if marker not in text:
                  raise SystemExit('Architecture marker not found')
              text = text.replace(marker, marker + paragraph, 1)
              addon.write_text(text)

          index = Path('hubitat-mcp-ai/CHANGELOG-INDEX.md')
          text = index.read_text()
          text = text.replace('- [0.16.91](CHANGELOG-0.16.91.md)\n\n## Recent performance releases\n', '- [0.16.92](CHANGELOG-0.16.92.md)\n\n## Recent performance releases\n\n- [0.16.91](CHANGELOG-0.16.91.md)\n', 1)
          index.write_text(text)

          Path('hubitat-mcp-ai/CHANGELOG-0.16.92.md').write_text('''# Hubitat MCP AI 0.16.92\n\n## Scheduled Internet control handoff\n\n- Fixes the 0.16.91 live regression where `block Google-TV-Streamer after 1 min` was captured by the immediate Internet parser and resolved as a device literally named `Google-TV-Streamer after 1 min`.\n- The immediate Internet path now reuses the general future/recurring timing guard instead of maintaining a narrower duplicate relative-delay regex.\n- `after N minutes|hours`, `in N minutes|hours`, `N minutes|hours later`, absolute-clock schedules, and recurring Internet controls bypass immediate device resolution and remain available to deterministic RuleAuthoringService scheduling.\n- Bare immediate Internet controls such as `block Google-TV-Streamer` retain the existing deterministic fast path.\n- The 0.16.91 relative one-time scheduler remains unchanged: the requested delay is converted to a dated Certain Time trigger and is not duplicated as a Rule Machine Delay action.\n\n## Regression coverage\n\n- Scheduled Internet prompts using `after`, `in`, `later`, absolute clock, and recurring wording must return `None` from the immediate Internet parser.\n- Immediate `block X` still resolves to `blockInternet`.\n- The exact live phrase `block Google-TV-Streamer after 1 min` must hand off to RuleAuthoringService with target `Google-TV-Streamer`, not a target containing the timing suffix.\n''')
          PY
          rm .github/workflows/one-shot-package-0.16.92.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md hubitat-mcp-ai/config.yaml hubitat-mcp-ai/README.md hubitat-mcp-ai/CHANGELOG-INDEX.md hubitat-mcp-ai/CHANGELOG-0.16.92.md .github/workflows/one-shot-package-0.16.92.yml
          git commit -m "Package HomeBrain 0.16.92"
          git push origin HEAD:fix/internet-relative-routing-0.16.92
