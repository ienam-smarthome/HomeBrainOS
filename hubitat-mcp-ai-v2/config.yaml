name: "Hubitat MCP AI v2 (Preview)"
version: "2.0.0-alpha.190"
slug: hubitat_mcp_ai_v2
description: "Clean, model-led Hubitat MCP assistant with external diagnostics recorder"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: experimental
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: manual
init: false
ingress: true
homeassistant_api: true
hassio_api: true
ingress_port: 8789
panel_icon: mdi:brain
panel_title: "Hubitat MCP AI v2"
ports:
  8789/tcp: null
ports_description:
  8789/tcp: "Optional direct interface; use Home Assistant ingress"
webui: "http://[HOST]:[PORT:8789]"
# Home Assistant Supervisor treats options with defaults as required even
# if schema uses '?'. Provider API keys are optional in the add-on editor
# and required only for the active selected provider. No blank password
# defaults in options: and no migration of old local-Ollama credentials.
options:
  # Free always uses OpenRouter. Paid mode chooses exactly one provider.
  cloud_mode: "free"
  cloud_free_model: "openrouter/free"
  cloud_paid_provider: "openrouter"
  cloud_paid_model: "google/gemini-3.1-flash-lite"
  ollama_cloud_model: "nemotron-3-super"
  cloud_paid_consent: false
  model_timeout_seconds: 120
  mcp_timeout_seconds: 25
  investigation_timeout_seconds: 300
  # A fresh Ask authorizes verified ordinary light ON/OFF, no second click.
  routine_auto_approve_lights: true
  # Comma-separated native IDs of explicitly trusted physical safe switches.
  # Empty = other switches still require approval.
  routine_auto_approve_safe_switch_ids: ""
  hub_timezone: "Europe/London"
  external_hub_diagnostics_enabled: false
  external_hub_diagnostics_probe_seconds: 30
  external_hub_diagnostics_cpu_cores: 4
  external_hub_diagnostics_hub_timezone: "Europe/London"
  external_hub_diagnostics_retention_days: 30
  device_monitor_enabled: false
  one_off_cleanup_enabled: false
  one_off_cleanup_dry_run: true
  one_off_cleanup_time: "07:00"
  one_off_cleanup_timezone: "Europe/London"
  one_off_cleanup_grace_minutes: 15
  ha_tts_enabled: false
  briefing_enabled: false
  briefing_time: "07:30"
  home_alerts_enabled: false
  home_alert_open_minutes: 30
  network_alerts_enabled: false
  network_alert_grace_minutes: 5
  network_alert_hub_grace_minutes: 8
schema:
  hubitat_mcp_url: str?
  hubitat_mcp_token: password?
  network_router_host: str?
  cloud_mode: list(free|paid)
  cloud_free_model: str
  cloud_paid_provider: list(openrouter|ollama)
  cloud_paid_model: str
  ollama_cloud_model: str
  cloud_paid_consent: bool
  cloud_api_key: password?
  ollama_cloud_api_key: password?
  model_timeout_seconds: int(10,300)
  mcp_timeout_seconds: int(5,90)
  investigation_timeout_seconds: int(30,1800)
  routine_auto_approve_lights: bool
  routine_auto_approve_safe_switch_ids: str?
  hub_timezone: str
  external_hub_diagnostics_enabled: bool
  external_hub_diagnostics_hub_url: str?
  external_hub_diagnostics_probe_seconds: int(30,300)
  external_hub_diagnostics_cpu_cores: int(1,64)
  external_hub_diagnostics_hub_timezone: str
  external_hub_diagnostics_retention_days: int(1,90)
  device_monitor_enabled: bool
  device_monitor_api_base: str?
  device_monitor_access_token: password?
  one_off_cleanup_enabled: bool
  one_off_cleanup_dry_run: bool
  one_off_cleanup_time: str
  one_off_cleanup_timezone: str
  one_off_cleanup_grace_minutes: int(10,1440)
  ha_tts_enabled: bool
  ha_tts_notify_service: str?
  ha_tts_media_stream: str?
  briefing_enabled: bool
  briefing_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  home_alerts_enabled: bool
  home_alert_open_minutes: int(5,720)
  network_alerts_enabled: bool
  network_alert_notify_service: str?
  network_alert_grace_minutes: int(1,120)
  network_alert_hub_grace_minutes: int(1,120)
