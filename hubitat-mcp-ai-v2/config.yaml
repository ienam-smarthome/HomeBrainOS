name: "Hubitat MCP AI v2 (Preview)"
version: "2.0.0-alpha.87"
slug: hubitat_mcp_ai_v2
description: "Clean, model-led Hubitat MCP assistant with external diagnostics recorder"
url: "https://github.com/ienam-smarthome/HomeBrainOS"
stage: experimental
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: manual
init: false
ingress: true
homeassistant_api: true
hassio_api: true
ingress_port: 8789
panel_icon: mdi:brain
panel_title: "Hubitat MCP AI v2"
ports:
  8789/tcp: null
ports_description:
  8789/tcp: "Optional direct interface; use Home Assistant ingress"
webui: "http://[HOST]:[PORT:8789]"
# Home Assistant Supervisor treats an option WITH a default as required,
# even when the schema has '?'! Keep the optional blank keys below out of
# options:, but let app.py DEFAULTS provide runtime empty-string values.
# Users can reveal optional fields in the add-on editor as needed.
options:
  model_base_url: "https://ollama.com"
  model_name: "gemma4:31b-cloud"
  cloud_fallback_enabled: false
  cloud_fallback_model: "openrouter/free"
  model_timeout_seconds: 120
  mcp_timeout_seconds: 25
  investigation_timeout_seconds: 300
  hub_timezone: "Europe/London"
  external_hub_diagnostics_enabled: false
  external_hub_diagnostics_probe_seconds: 30
  external_hub_diagnostics_cpu_cores: 4
  external_hub_diagnostics_hub_timezone: "Europe/London"
  external_hub_diagnostics_retention_days: 30
  device_monitor_enabled: false
  one_off_cleanup_enabled: false
  one_off_cleanup_dry_run: true
  one_off_cleanup_time: "07:00"
  one_off_cleanup_timezone: "Europe/London"
  one_off_cleanup_grace_minutes: 15
  ha_tts_enabled: false
schema:
  hubitat_mcp_url: str?
  hubitat_mcp_token: password?
  model_base_url: str
  model_name: str
  model_api_key: password?
  cloud_fallback_enabled: bool
  cloud_fallback_model: str
  cloud_fallback_api_key: password?
  model_timeout_seconds: int(10,300)
  mcp_timeout_seconds: int(5,90)
  investigation_timeout_seconds: int(30,1800)
  hub_timezone: str
  external_hub_diagnostics_enabled: bool
  external_hub_diagnostics_hub_url: str?
  external_hub_diagnostics_probe_seconds: int(30,300)
  external_hub_diagnostics_cpu_cores: int(1,64)
  external_hub_diagnostics_hub_timezone: str
  external_hub_diagnostics_retention_days: int(1,90)
  device_monitor_enabled: bool
  device_monitor_api_base: str?
  device_monitor_access_token: password?
  one_off_cleanup_enabled: bool
  one_off_cleanup_dry_run: bool
  one_off_cleanup_time: str
  one_off_cleanup_timezone: str
  one_off_cleanup_grace_minutes: int(10,1440)
  ha_tts_enabled: bool
  ha_tts_notify_service: str?
  ha_tts_media_stream: str?
